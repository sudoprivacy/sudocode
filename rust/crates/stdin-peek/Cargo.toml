[package]
name = "stdin-peek"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Deliberately NOT `[lints] workspace = true`.
#
# The workspace root sets `unsafe_code = "forbid"`, and `forbid` cannot be
# relaxed from inside a crate that inherits it. Two Win32 questions need FFI and
# therefore `unsafe`: whether a pipe holds data without starting a read
# (`PeekNamedPipe`), and what text bytes in the console's code page spell
# (`MultiByteToWideChar`). Isolating those calls here keeps `forbid` absolute in
# every other crate: this file is the workspace's entire `unsafe` surface.
#
# If you are tempted to add anything else to this crate — don't. Each function
# here is the smallest safe wrapper around one OS call; policy belongs in a
# crate the lint still covers.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
] }
