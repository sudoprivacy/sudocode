name: Rust CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: box-bootstrap-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-windows-bootstrap-probe:
    name: Native Windows Box bootstrap diagnostic (not PR acceptance)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual private Box data readiness and full crash recovery
        shell: bash
        run: |
          set -euo pipefail
          source e2e/nexus-a2a/lib.sh
          GRPCURL="$(grpcurl_bin)"
          python .github/scripts/probe_box_bootstrap.py --grpcurl "$(native_path "$GRPCURL")"
      - name: Preserve the actual native binary, startup observations and sanitized logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-box-bootstrap-diagnostic
          path: box-bootstrap-probe/
          retention-days: 7
          if-no-files-found: error
