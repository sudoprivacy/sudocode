# Diagnostic branch only: never merge this replacement workflow.
name: Native console status diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  console-status:
    name: Native shell statuses (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      SCODE_TEST_BACKEND: mock
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Real CLI, shell results, provider request and cold resume
        working-directory: rust
        run: cargo test --locked -p rusty-sudocode-cli --test pty_bash_compact_results -- --nocapture
