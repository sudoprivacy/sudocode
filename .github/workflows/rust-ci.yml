# Diagnostic branch only: never merge this replacement workflow.
name: Native terminal style diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal-style:
    name: Native styles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      SCODE_TEST_BACKEND: mock
      NO_COLOR: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - run: npm ci --prefix e2e/terminal-resize
      - name: Real CLI queue, chrome, history, cache and cancellation
        working-directory: rust
        run: >-
          cargo test --locked -p rusty-sudocode-cli
          --test pty_chrome_styles --test pty_a2a_overlay --test pty_queue_overlay
          --test pty_input_batch --test pty_cache_prefix --test pty_plan_confirm
          --test pty_background_tasks --test interrupt_e2e
          -- --test-threads=2
      - name: Complete palette target including real terminal peers
        working-directory: rust
        run: cargo test --locked -p rusty-sudocode-cli --test pty_codex_colors -- --include-ignored --test-threads=2
