name: Reviewed acceptance cache bootstrap
on:
  workflow_dispatch:
    inputs:
      target_kind:
        description: Exact approved correction or its isolated normal queue group
        type: choice
        options: [pull_request, merge_group]
        required: true
permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write
jobs:
  bootstrap:
    if: github.actor == 'elfenlieds7'
    name: Verify the approved four-file correction
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 893bc7e8ec260881897ed6640f651eed9ccff787
          path: protected
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: operation
          sparse-checkout: .github/local-acceptance/cache-bootstrap1138.py
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed blobs, signed real checks, ordinary refusal and exact target
        working-directory: protected
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_TARGET_KIND: ${{ inputs.target_kind }}
        run: python ../operation/.github/local-acceptance/cache-bootstrap1138.py
