name: Rust CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    name: Diagnose Unicode draft on shipped Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39294583186
          artifact-ids: 12207637963
          path: binaries/main
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39302883208
          artifact-ids: 12214975611
          path: binaries/candidate
      - name: Install the unchanged shared terminal observer
        run: npm ci --prefix e2e/terminal-resize
      - name: Record binary provenance
        run: |
          binaries/main/scode.exe version --output-format json
          binaries/candidate/scode.exe version --output-format json
          Get-FileHash binaries/main/scode.exe
          Get-FileHash binaries/candidate/scode.exe
      - name: Compare raw and pasted Unicode through both native ConPTY backends
        run: node e2e/terminal-resize/prose-input-diagnostic.cjs binaries/main/scode.exe binaries/candidate/scode.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-prose-unicode-diagnostic
          path: diagnostic-results
          if-no-files-found: error
