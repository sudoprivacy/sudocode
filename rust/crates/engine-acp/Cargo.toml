[package]
name = "engine-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["websocket"]
websocket = ["dep:axum"]
mailbox = ["dep:a2a", "dep:managed-agent", "dep:kernel"]

[dependencies]
# engine-acp sits ABOVE the seam on the renderer side: it consumes the engine
# through EngineCommand/EngineEvent on an EngineHandle and
# translates to/from the ACP wire. Runtime remains a dependency for composition
# and lifecycle operations.
runtime = { path = "../runtime" }
# The slash-command SSOT (AcpSlashCommandSpec + the command table) the ACP server
# advertises. `commands` sits below the renderer, so this is a forward edge.
commands = { path = "../commands" }
# Below the seam: the single-session engine each ACP session wraps
# (SessionEngine = EngineDelegate + SessionLifecycle) and the seam itself
# (EngineCommand / EngineEvent / EngineHandle). Neither depends on engine-acp.
engine-host = { path = "../engine-host" }
engine-core = { path = "../engine-core" }
agent-client-protocol = { workspace = true }
agent-client-protocol-schema = { workspace = true }
agent-client-protocol-tokio = { workspace = true }
axum = { workspace = true, optional = true }
a2a = { workspace = true, optional = true }
managed-agent = { workspace = true, optional = true }
kernel = { workspace = true, optional = true }
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
# The ACP stdio server polls stdin + watches the parent PID via termios/poll on
# Unix (the ppid-death watchdog); the whole block is `#[cfg(unix)]`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["poll", "process"] }

[lints]
workspace = true

[dev-dependencies]
tools = { path = "../tools" }
mock-anthropic-service = { path = "../mock-anthropic-service" }
llm-mount = { workspace = true }
backends = { workspace = true, features = ["driver-anthropic", "driver-openai"] }
tempfile = "3"
