name: Rendering performance on main

# The paired rendering matrix measures typing latency, first output and cancel
# against the policy's fixed baseline (e2e/terminal-resize/performance-policy.json).
# It runs once a day on main instead of on every PR: a regression is found within
# a day and bisected between nightly heads. The same container check runs locally
# with `python .github/local-acceptance/checks.py --native-checks rendering`.

on:
  schedule:
    - cron: '17 17 * * *'  # 01:17 CST (UTC+8), after the nightly tag moves
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendering-main
  cancel-in-progress: false

jobs:
  rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the shared native process monitor
        run: python -m pip install psutil==7.2.2
      - name: Paired rendering matrix against the fixed baseline
        run: >
          python .github/local-acceptance/checks.py --native-checks rendering
          --base origin/main --output "${{ runner.temp }}/rendering-main"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-main
          path: |
            ${{ runner.temp }}/rendering-main/rendering/*.log
            ${{ runner.temp }}/rendering-main/rendering/container/rendering/measurements/**/report.json
            ${{ runner.temp }}/rendering-main/rendering/container/rendering/measurements/**/summary.md
          retention-days: 30
