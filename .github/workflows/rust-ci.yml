name: Rust CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: error-observation-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-windows-causal-probe:
    name: Native Windows error observation diagnostic (not PR acceptance)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      SCODE_TEST_BACKEND: mock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-error-observation-diagnostic
          run-id: 40795813479
          github-token: ${{ github.token }}
          path: previous-probe
      - name: Use the original CI ephemeral port range
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=10000 num=55535
          netsh int ipv4 show dynamicport tcp
      - name: Compare the rendered observer using the exact failing native images
        run: python .github/scripts/probe_error_observation.py
      - name: Preserve every control and the actual Windows binary pair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-error-observation-diagnostic
          path: error-observation-probe/
          retention-days: 7
          if-no-files-found: error
