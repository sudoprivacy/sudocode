[package]
name = "tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api = { path = "../api" }
async-trait = "0.1"
command-group = "5"
commands = { path = "../commands" }
flate2 = "1"
futures = "0.3"
plugins = { path = "../plugins" }
runtime = { path = "../runtime" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
# A real Kernel for the co-hosted store proof (tests/cohost_agent_store.rs):
# the sub-agent store is asserted against the VFS it claims to live in, not a
# mock of it. Same nexus-vfs rev the runtime crate pins — a mismatched rev is two
# kernels in one process.
kernel = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "191fa0efaecf91ed5cc35a021fc13d81c1df3153", default-features = false }

[lints]
workspace = true
