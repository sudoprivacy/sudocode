name: Company CI key quota diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read current company token quota without model requests
        env:
          COMPANY_CI_KEY: ${{ secrets.SUDOROUTER_CI_API_KEY }}
        shell: python
        run: |
          import datetime
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          key = os.environ['COMPANY_CI_KEY']
          if not key:
              raise SystemExit('Company CI secret is unavailable')
          opener = urllib.request.build_opener(NoRedirect())
          numeric_fields = ('total_granted', 'total_used', 'total_available')
          completed = 0
          for sample in range(1):
              record = {'sample': sample + 1,
                        'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                        'units': 'provider raw quota units'}
              request = urllib.request.Request(
                  'https://api.sudorouter.ai/api/usage/token',
                  headers={'Authorization': 'Bearer ' + key, 'Accept': 'application/json'})
              try:
                  with opener.open(request, timeout=20) as response:
                      payload = json.load(response)
                  data = payload.get('data')
                  if payload.get('success') is False or not isinstance(data, dict):
                      raise ValueError('No token usage object')
                  for field in numeric_fields:
                      value = data.get(field)
                      if type(value) in (int, float):
                          record[field] = value
                  if type(data.get('unlimited_quota')) is bool:
                      record['unlimited_quota'] = data['unlimited_quota']
                  label = data.get('name')
                  if isinstance(label, str) and key not in label:
                      record['token_label'] = label[:128]
                  record['status'] = 'ok'
                  completed += 1
              except urllib.error.HTTPError as error:
                  record.update(status='http_error', http_status=error.code)
                  try:
                      failure = json.load(error)
                      details = failure.get('error', failure)
                      if isinstance(details, dict):
                          for field in ('type', 'code', 'message'):
                              value = details.get(field)
                              if isinstance(value, (str, int)):
                                  safe = str(value).replace(key, '[REDACTED]')
                                  safe = re.sub(r'sk-[A-Za-z0-9_-]+', '[REDACTED]', safe)
                                  record['provider_' + field] = safe[:500]
                  except (ValueError, TypeError, AttributeError):
                      record['provider_body'] = 'not structured JSON'
              except Exception as error:
                  record.update(status='error', error_type=type(error).__name__)
              print(json.dumps(record), flush=True)
          if completed != 1:
              raise SystemExit('Not all read-only quota samples completed')
