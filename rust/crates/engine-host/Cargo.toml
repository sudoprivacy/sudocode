[package]
name = "engine-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# engine-host is the ENGINE side of the seam: it owns session construction, the
# `ConversationRuntime` wrapper, the tool executor, and the `EngineDelegate` /
# `SessionLifecycle` impl (`SessionEngine`). Both the CLI (REPL renderer) and
# `engine-acp` depend on it to build a session; neither the wire types nor the
# renderer live here. Dependencies are added as the engine code moves in.
[dependencies]
# `SudoCodeConfig` (the config SSOT, re-exported by engine-core) for model/alias
# resolution.
engine-core = { path = "../engine-core" }
# `ConfigLoader`, `PermissionMode`, `ResolvedPermissionMode`, the workspace-root
# lookup, the model-capability seeding, and the MCP server manager / config types
# the engine-side MCP state drives.
runtime = { path = "../runtime" }
# The MCP engine state merges plugin-advertised MCP servers (`PluginLoadOutcome`)
# and exposes the discovered tools as `RuntimeToolDefinition`s.
plugins = { path = "../plugins" }
# The managed-agent DI seam (`SpawnTask` + `SpawnHandle`) that
# `SudoCodeSpawnAdapter` implements so nexus can host an agent loop in-process.
# Same nexus-vfs rev the runtime crate pins (transitive `kernel` unifies).
# default-features = false → no subprocess-host, which is the raw-ACP path
# rather than the in-process co-host.
managed-agent = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "2467f35825b872daed0c7913d0466f221cd813df", default-features = false }
tools = { path = "../tools" }
# The standalone session's own kernel (`local_kernel`): a CLI session's file
# tools reach a VFS, like the co-hosted agent's do, so neither host has hooks or
# an audit trail the other lacks. Same nexus-vfs rev `runtime` and
# `managed-agent` pin — a second rev would make `Kernel` two types and the
# co-host's `SpawnTask<Kernel>` stop unifying.
kernel = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "2467f35825b872daed0c7913d0466f221cd813df", default-features = false }
# `LocalConnectorBackend` — the reference-mode connector that mounts a host
# directory without copying it, so the workspace files stay the source of truth.
# Only that driver: the connector umbrella would drag an HTTP + crypto stack
# into the CLI for backends a standalone session never mounts.
backends = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "2467f35825b872daed0c7913d0466f221cd813df", default-features = false, features = ["driver-local-connector"] }
# MCP discovery/dispatch drives an isolated Tokio runtime; tool payloads and the
# degraded-server report serialize through serde_json.
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json.workspace = true
# The tool executor deserializes each tool's JSON input into a typed request.
serde = { version = "1", features = ["derive"] }
# The standalone nexus-A2A session dials the daemon over the VFS client.
nexus-vfs-client = { path = "../nexus-vfs-client" }
# `SessionTracer` — the `BuiltRuntime` / `SessionEngine` expose the runtime's
# session tracer to the renderer for `/status`-style reads.
telemetry = { path = "../telemetry" }
# `render_skills_prompt_section` — the runtime build path advertises available
# skills (incl. plugin-provided roots) in the system prompt.
commands = { path = "../commands" }

[dev-dependencies]
# `send_message_routing` drives the executor's async trait method to
# completion and needs a workspace to prove the local delivery path.
#
# `rt-multi-thread`: the scripted model runs on its own runtime while the agent
# loop blocks a test thread waiting for it, so a current-thread runtime would
# deadlock the two against each other.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
# `cohost_mock_llm` stands the co-host up against a scripted model, so the
# co-host has a CI gate that needs no API key and no network beyond loopback.
mock-anthropic-service = { path = "../mock-anthropic-service" }

[lints]
workspace = true
