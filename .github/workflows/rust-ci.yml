name: Rust CI

on:
  push:
    branches:
      - main
      - 'gaebal/**'
      - 'omx-issue-*'
    paths:
      - .github/workflows/rust-ci.yml
      - .github/workflows/release.yml
      - .github/scripts/check_doc_source_of_truth.py
      - .github/FUNDING.yml
      - README.md
      - sudo-code-roadmap.html
      - CLAUDE.md
      - CONTRIBUTING.md
      - LAST_CODEX_REF_VERSION
      - LAST_PARITY_SYNC_COMMIT
      - LAST_CCB_REF_VERSION
      - docs/**
      - rust/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rust-ci.yml
      - .github/workflows/release.yml
      - .github/scripts/check_doc_source_of_truth.py
      - .github/FUNDING.yml
      - README.md
      - sudo-code-roadmap.html
      - CLAUDE.md
      - CONTRIBUTING.md
      - LAST_CODEX_REF_VERSION
      - LAST_PARITY_SYNC_COMMIT
      - LAST_CCB_REF_VERSION
      - docs/**
      - rust/**
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  doc-source-of-truth:
    name: docs source-of-truth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check docs and metadata for stale branding
        run: python .github/scripts/check_doc_source_of_truth.py

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Check formatting
        run: cargo fmt --all --check

  boundary-gate:
    name: engine/renderer boundary gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Renderer crates must not name engine-internal streaming types
        # The engine<->renderer seam is enforced by the dependency graph: a
        # renderer crate that dropped its runtime/api dep literally cannot name
        # runtime::RuntimeObserver / runtime::TurnSummary. This gate is the CI
        # half of that bisection — it fails loudly if either type is reintroduced
        # into a renderer crate (route it through the EngineEvent seam instead).
        run: |
          if rg -n --pcre2 'runtime::(TurnSummary|RuntimeObserver)' \
               rust/crates/rusty-sudocode-cli rust/crates/engine-acp; then
            echo "::error::a renderer crate names a forbidden engine-internal type (runtime::RuntimeObserver / runtime::TurnSummary) — cross the EngineEvent seam instead"
            exit 1
          fi

      - name: Vendored vfs.proto must match what nexus-vfs publishes
        shell: bash
        # rust/crates/nexus-vfs-client vendors a copy of the VFS service
        # definition. nexus-vfs owns it, and the copy has drifted before --
        # it kept sending WriteRequest.content_id after upstream reserved the
        # field (their issue #5, where the documented If-Match contract was a
        # no-op that masked concurrent-writer data loss). Diff against the
        # definition shipped in the published Node client, which nexus-vfs
        # generates from that same proto. Public bucket, no credentials.
        run: |
          set -euo pipefail
          url='https://sudowork-runtime-1309794936.cos.accelerate.myqcloud.com/nexus-vfs/clients/node/latest/nexus-ai-fs-vfs-client.tgz'
          work="$(mktemp -d)"
          if ! curl -fsSL --retry 3 --max-time 60 "$url" -o "$work/client.tgz"; then
            echo "::warning::could not reach the published client; skipping the proto drift check"
            exit 0
          fi
          tar xzf "$work/client.tgz" -C "$work"
          upstream="$work/package/proto/nexus/grpc/vfs/vfs.proto"
          vendored='rust/crates/nexus-vfs-client/proto/nexus/grpc/vfs/vfs.proto'
          if ! diff -u --strip-trailing-cr "$upstream" "$vendored"; then
            echo "::error::$vendored has drifted from the definition nexus-vfs publishes; copy the upstream file over it and fix the fallout"
            exit 1
          fi
          echo "vendored vfs.proto matches upstream"

  test-workspace:
    name: cargo test --workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run workspace tests
        run: cargo test --workspace

  a2a-live:
    name: nexus-A2A live (real daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      # The one thing unit tests structurally cannot reach: an envelope moving
      # through a real gRPC server and a real DT_STREAM, and a blocking tail
      # woken by a real write. `ensure_inbox` shipped broken for exactly that
      # reason — the shape was right, the code ran, and only a daemon has an
      # opinion about whether the stream exists.
      #
      # `run.sh` downloads the daemon the lockfile pins (see fetch-daemon.sh),
      # boots it auth-off on loopback, waits for a writable single-voter leader,
      # and runs the deterministic live tests. No secrets: the LLM duet inside
      # the same script gates on SUDOROUTER_API_KEY, which this job has not got.
      #
      # One OS on purpose. What this catches is the client/daemon contract,
      # which does not vary by host — platform-specific daemon behaviour is
      # nexus-vfs's own CI. Adding runners would multiply the daemon-boot flake
      # surface for signal already covered.
      - name: A2A round-trip against the pinned daemon
        run: e2e/nexus-a2a/run.sh

  bench-compile:
    name: cargo bench --no-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Compile benches (catches API drift without paying full sample cost)
        run: cargo bench --workspace --no-run

  clippy-workspace:
    name: cargo clippy --workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run workspace clippy
        run: cargo clippy --workspace

  live-api-smoke:
    name: Live API smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run live API smoke tests
        working-directory: rust
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: cargo test -p rusty-sudocode-cli --test acp_live_smoke -- --test-threads=1
