# Diagnostic branch only: never merge this replacement workflow.
name: Canonical native workspace diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-paths:
    name: Canonical workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      SCODE_TEST_BACKEND: mock
      NO_COLOR: ''
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Actual canonicalized cohost and native shell file roundtrip
        run: cargo test --locked -p engine-host --test cohost_local_workspace -- --nocapture
      - name: Canonical workspace authorization and namespace integration
        if: success() || failure()
        run: cargo test --locked -p runtime --test fs_backend_vfs -- --test-threads=2 --nocapture
