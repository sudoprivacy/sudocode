name: Local and cross-platform acceptance
run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft local acceptance' || 'Local acceptance' }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: acceptance-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: true

jobs:
  proof:
    name: Verify local acceptance
    if: github.event_name == 'merge_group' || !github.event.pull_request.draft
    # Signature/Git metadata needs no Linux runtime. Linux queue contention
    # otherwise delays both this gate and its dependent native platforms.
    runs-on: windows-latest
    outputs:
      needed: ${{ steps.proof.outputs.needed }}
      matrix: ${{ steps.proof.outputs.matrix }}
      policy_ref: ${{ steps.proof.outputs.policy_ref }}
      base_sha: ${{ steps.proof.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR's base SHA can lag the protected branch even on a new ready
          # event. Use current protected policy, just as the hook/publisher do;
          # downstream jobs still pin the exact verified executor output.
          ref: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify signed local evidence and select missing native hosts
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/local-acceptance/gate.py

  native:
    name: ${{ matrix.name }}
    needs: proof
    if: needs.proof.outputs.needed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        working-directory: candidate
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.proof.outputs.matrix) }}
    env:
      # Match the shared publisher's cache key. The trusted executor sets its
      # one-job/incremental limits only on compiler subprocesses, after restore.
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      SCODE_TEST_BACKEND: mock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # Ordinary PRs use protected main. Exact-head maintainer contract
          # authorization permits the newly verified executor and new checks.
          ref: ${{ needs.proof.outputs.policy_ref }}
          path: .trusted-acceptance
          persist-credentials: false
      - uses: ./.trusted-acceptance/.github/actions/rust-toolchain
        if: matrix.family == 'native'
        with:
          # The candidate's own pin decides what its Cargo commands resolve.
          # A branch created before the pin uses the protected one.
          toolchain-file: |
            candidate/rust-toolchain.toml
            .trusted-acceptance/rust-toolchain.toml
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the shared native cache paths
        if: matrix.family == 'native'
        id: cache_layout
        run: python ../.trusted-acceptance/.github/local-acceptance/cache_layout.py --source candidate/rust --github-output
      - uses: Swatinem/rust-cache@v2
        if: matrix.family == 'native'
        with:
          workspaces: ${{ steps.cache_layout.outputs.workspaces }}
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false
      - name: Install acceptance observer dependencies
        run: python -m pip install psutil jsonschema
      - name: Verify real native host-lease inheritance before compilation
        if: matrix.family == 'native'
        shell: python
        env:
          INHERITED_LEASE_OUTPUT: ${{ runner.temp }}/local-acceptance/inherited-lease
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable,
                          '../.trusted-acceptance/e2e/local-acceptance/inherited_lease_acceptance.py',
                          '--output', os.environ['INHERITED_LEASE_OUTPUT']], check=True)
      - name: Prepare pinned tools through the authenticated GitHub API
        if: matrix.family == 'native'
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_NATIVE_CHECKS: ${{ join(matrix.checks, ' ') }}
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/local-acceptance
        run: python ../.trusted-acceptance/.github/local-acceptance/prepare_tools.py
      - name: Run the same native commands on the missing platform
        env:
          ACCEPTANCE_NATIVE_CHECKS: ${{ join(matrix.checks, ' ') }}
          ACCEPTANCE_BASE: ${{ needs.proof.outputs.base_sha }}
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/local-acceptance
        run: python ../.trusted-acceptance/.github/local-acceptance/cross_platform.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-platform-${{ matrix.family }}-${{ matrix.os }}
          path: ${{ runner.temp }}/local-acceptance
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.family == 'sdk' && success()
        with:
          name: scode-acp-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: candidate/sdk/typescript/artifacts/*
          if-no-files-found: error
