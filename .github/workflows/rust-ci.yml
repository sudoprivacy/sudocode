name: Rust CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    name: Diagnose native Windows resize geometry
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - uses: actions/checkout@v4
        with:
          repository: sudoprivacy/iocraft
          ref: e04d0675960b4df36399450af513b48a78a59f92
          path: diagnostic-iocraft
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the same pinned terminal runtime as the native CI gate
        run: python e2e/terminal-resize/setup_windows.py "$env:RUNNER_TEMP/scode-terminal-host"
      - name: Instrument resize geometry without changing the algorithm
        run: |
          python .github/diagnostics/geometry.py
          "SCODE_TERMINAL_HOST=$env:RUNNER_TEMP/scode-terminal-host/Code.exe" >> $env:GITHUB_ENV
          "SCODE_TERMINAL_MODULES=$env:RUNNER_TEMP/scode-terminal-host/07f806f999/resources/app/node_modules.asar" >> $env:GITHUB_ENV
          "IOCRAFT_GEOMETRY_LOG=$env:RUNNER_TEMP/resize-geometry.log" >> $env:GITHUB_ENV
      - name: Build the same source with geometry observation
        working-directory: rust
        run: cargo test -p rusty-sudocode-cli --test pty_prose_preview --no-run
      - name: Capture the exact fallback case and screen before changing its assertions
        working-directory: rust
        env:
          SCODE_TEST_BACKEND: mock
        run: |
          & cargo test -p rusty-sudocode-cli --test pty_prose_preview ambiguous_grapheme_width_uses_complete_block_fallback -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-fallback.log"
          $global:LASTEXITCODE = 0
      - name: Run complete native scenarios five times and retain every failure
        working-directory: rust
        env:
          SCODE_TEST_BACKEND: mock
        run: |
          $failed = 0
          foreach ($iteration in 1..5) {
            $env:SCODE_TERMINAL_LOG_DIR = "$env:RUNNER_TEMP/native-$iteration"
            & cargo test -p rusty-sudocode-cli --test pty_prose_preview -- --ignored --nocapture 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-$iteration.log"
            if ($LASTEXITCODE -ne 0) { $failed += 1 }
          }
          "Native rounds failed: $failed/5"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-resize-geometry
          path: |
            ${{ runner.temp }}/resize-geometry.log
            ${{ runner.temp }}/native-*
          if-no-files-found: error
