name: Rust CI
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: viewport-cpu-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  viewport-cpu-diagnostic:
    name: Original/fixed viewport CPU diagnostic (never merge this branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      SCODE_TEST_BACKEND: mock
      VIEWPORT_CANDIDATE_REF: test/viewport-cpu-candidate-20261029
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve original images and compare under the original unchanged policy
        run: python .github/scripts/probe_viewport_cpu.py
      - name: Retain sealed programs, original controls and exact provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-cpu-original-source-diagnostic
          path: ${{ runner.temp }}/viewport-cpu-qualification/
          retention-days: 7
          compression-level: 3
          if-no-files-found: error
