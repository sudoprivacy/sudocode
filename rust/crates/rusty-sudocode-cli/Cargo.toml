[package]
name = "rusty-sudocode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "scode"
path = "src/main.rs"

[dependencies]
codex-mermaid.workspace = true
process-text = { path = "../process-text" }
arboard = { version = "3", features = ["image-data"] }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
commands = { path = "../commands" }
compat-harness = { path = "../compat-harness" }
engine-core = { path = "../engine-core" }
engine-events = { path = "../engine-events" }
# The engine side below the seam (config/model/permission resolution today; the
# session builder + delegate as more engine code moves in). The REPL renderer
# re-imports these so it never owns a second copy of the engine's config SSOT.
engine-host = { path = "../engine-host" }
crossterm = "0.28"
futures = "0.3"
indicatif = "0.17"
iocraft = { git = "https://github.com/sudoprivacy/iocraft.git", rev = "e752ec29e5ab0db0a976cd50901373c779bb0ec1" }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
pulldown-cmark = "0.13"
# v19 fixes buffered-input stalls when the external printer is enabled (#977).
rustyline = "=19.0.0"
runtime = { path = "../runtime" }
# ACP renderer (server + stdio/ws transports) moved out of `runtime`.
engine-acp = { path = "../engine-acp" }
nexus-vfs-client = { path = "../nexus-vfs-client" }
plugins = { path = "../plugins" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
telemetry = { path = "../telemetry" }
serde = { version = "1", features = ["derive"] }
smol = "2"
shell-words = "1"
serde_json.workspace = true
service-host = { path = "../service-host" }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
tempfile = "3"
syntect = "5"
# Match the grammar/theme bundle in the Codex reference revision.
two-face = { version = "=0.5.1", default-features = false, features = ["syntect-onig"] }
# Codex's Unicode word breaking; the table path explicitly selects FirstFit.
textwrap = { version = "=0.16.2", default-features = false, features = ["unicode-linebreak", "unicode-width"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
tools = { path = "../tools" }
unicode-width = "0.2"
unicode-segmentation = "1"
vte = "0.15"

[lints]
workspace = true

[dev-dependencies]
flate2 = "1"
futures-util = "0.3"
mock-anthropic-service = { path = "../mock-anthropic-service" }
pty-expect.workspace = true
rcgen = "0.14"
serde_json.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-tungstenite = "0.29"

[target.'cfg(windows)'.dependencies]
# Safe process stderr capture for the inline renderer (already in Cargo.lock).
filedescriptor = "=0.8.3"
# The one crate allowed to contain `unsafe` — see its docs for why the
# workspace's `unsafe_code = "forbid"` is kept absolute everywhere else.
stdin-peek = { path = "../stdin-peek" }
self-replace = "1.5"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "poll", "signal", "fs"] }
