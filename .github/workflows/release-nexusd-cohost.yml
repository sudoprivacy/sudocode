name: Release nexusd-cohost

# The daemon that hosts sudocode agents in-process — the artifact sudocloud
# deploys. A SECOND product out of this repo, and deliberately on its own tag
# namespace rather than riding `v*`:
#
#   * `v*` (and `nightly`) release `scode`, a CLI, on every patch. Republishing a
#     ~40 MiB daemon for a CLI-only change is waste, and a nightly cadence for a
#     production daemon is not a cadence anyone wants to deploy from.
#   * a co-host build is a PAIRING — this sudocode and one nexus-vfs tag — and the
#     pairing is what bit us: a daemon whose kernel rev differs from the agent
#     runtime's is two `Kernel` types in one process. So the build stamps the
#     nexus-vfs tag it was built against INTO the binary, read out of the workspace
#     manifest rather than typed into a release note, and asserts it is there.
#
# `nexusd-cluster` (nexus-vfs) is untouched by all of this and keeps its own slim
# size budget; this is the bigger binary for nodes that host agents, not a
# heavier version of that one.

on:
  push:
    tags:
      - 'nexusd-cohost-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-cohost-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pod target. ubuntu-22.04 (glibc 2.35) to match the base
          # `nexusd-cluster` releases from: the daemon loads plugin dylibs whose
          # glibc floor is set by the runner that built THEM, and a co-host built
          # on a newer glibc than the cluster it replaces would refuse them.
          - name: linux-x64
            os: ubuntu-22.04
            bin: nexusd-cohost
            package_dir: nexusd-cohost-linux-x64
            archive_name: nexusd-cohost-linux-x64.tar.gz
            max_size_bytes: 54525952  # 52 MiB — measured 51,997,848 bytes, 4.9% headroom
          - name: linux-arm64
            os: ubuntu-22.04-arm
            bin: nexusd-cohost
            package_dir: nexusd-cohost-linux-arm64
            archive_name: nexusd-cohost-linux-arm64.tar.gz
            max_size_bytes: 50331648  # 48 MiB — measured 48,620,624 bytes, 3.5% headroom
          # Not for deployment — for the cross-machine duet, which runs a real
          # co-host on a developer Mac and a developer Windows box. A daemon you
          # cannot run on the machines you debug from is a daemon you debug by
          # reading logs from somewhere else.
          - name: macos-arm64
            os: macos-15
            bin: nexusd-cohost
            package_dir: nexusd-cohost-macos-arm64
            archive_name: nexusd-cohost-macos-arm64.tar.gz
            max_size_bytes: 44040192  # 42 MiB — measured 42,226,080 bytes, 4.3% headroom
          # Intel, because the Mac this project actually debugs from is Intel. The
          # first cut of this matrix left it out reasoning "nothing runs a co-host
          # there", and the cross-machine bring-up falsified that within the hour:
          # `bad CPU type in executable`. A platform list is a claim about who runs
          # this, and that claim is worth checking against the machines in the room
          # rather than the ones in the design.
          - name: macos-x64
            os: macos-15-intel
            bin: nexusd-cohost
            package_dir: nexusd-cohost-macos-x64
            archive_name: nexusd-cohost-macos-x64.tar.gz
            max_size_bytes: 46137344  # 44 MiB — measured 43,750,416 bytes, 5.5% headroom
          - name: windows-x64
            os: windows-2022
            bin: nexusd-cohost.exe
            package_dir: nexusd-cohost-windows-x64
            archive_name: nexusd-cohost-windows-x64.zip
            max_size_bytes: 41943040  # 40 MiB — measured 39,765,504 bytes, 5.5% headroom
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # raft-proto 0.7.0 / protobuf-build 0.14.1 rejects protoc >= 4.x with a
      # faulty version check, so the pinned 3.20.2 is deliberate. Linux runners
      # ship an accepted protoc in the base image; macOS and Windows have either
      # none or one too new. (This is also why the `nexusd-cohost` bin sits behind
      # `--features daemon`: without the gate every `--workspace` job on every PR
      # would need this step.)
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          set -euo pipefail
          PROTOC_VERSION=3.20.2
          case "$(uname -m)" in
            arm64) ARCH=aarch_64 ;;
            x86_64) ARCH=x86_64 ;;
            *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/protoc"
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-osx-${ARCH}.zip"
          unzip -o /tmp/protoc.zip -d "$HOME/protoc"
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/protoc/bin/protoc" --version

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $protocVersion = '3.20.2'
          $protocDir = Join-Path $env:USERPROFILE 'protoc'
          New-Item -ItemType Directory -Force -Path $protocDir | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          Invoke-WebRequest -UseBasicParsing -Uri `
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protocVersion}/protoc-${protocVersion}-win64.zip" `
            -OutFile $zipPath
          Expand-Archive -Force -Path $zipPath -DestinationPath $protocDir
          $protocBinDir = Join-Path $protocDir 'bin'
          Add-Content -Path $env:GITHUB_PATH -Value $protocBinDir
          Add-Content -Path $env:GITHUB_ENV -Value "PROTOC=$(Join-Path $protocBinDir 'protoc.exe')"
          & "$(Join-Path $protocBinDir 'protoc.exe')" --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      # The three facts that identify this build, resolved once and stamped INTO the
      # binary. They used to be written to a sidecar `PAIRING.txt`, which answered the
      # question only for as long as the file stayed next to the executable it
      # described — and a daemon is copied to a pod, a laptop, a `/usr/local/bin`
      # without its tarball. A binary that cannot say what it is gets identified by
      # guesswork instead: this is the machinery behind `nexusd-cohost --version`.
      - name: Resolve build identity
        shell: bash
        run: |
          set -euo pipefail
          # Read out of the manifest, not typed here: the pin is the SSOT and the
          # `one nexus-vfs pin` job has already proven the manifest and the lock agree.
          NEXUS_VFS_TAG="$(grep -m1 -oE 'nexus-vfs", tag = "[^"]+"' Cargo.toml | sed 's/.*tag = "//; s/"//')"
          # On a tag build this is the released version; on a `workflow_dispatch` it is
          # the branch, which is the honest answer — a build off a branch is not a
          # release and should not print a version that says it is.
          version="${GITHUB_REF_NAME#nexusd-cohost-v}"
          version="${version//\//-}"
          # Semver build metadata, so the whole thing stays one token that a log line
          # can carry and a human can still read: `0.2.21+sudocode.<sha>.nexus-vfs.<tag>`.
          {
            echo "NEXUS_VFS_TAG=${NEXUS_VFS_TAG}"
            echo "NEXUSD_BUILD_VERSION=${version}+sudocode.$(git rev-parse --short=12 HEAD).nexus-vfs.${NEXUS_VFS_TAG}"
          } >> "$GITHUB_ENV"

      # `--locked`: a release artifact resolves to the revs the lockfile records
      # and nothing else. That is the same discipline the pin serves — the daemon
      # and the agent runtime inside it have to agree on one nexus-vfs.
      - name: Build release binary
        run: cargo build --locked --release -p nexusd-cohost --features daemon --bin nexusd-cohost

      # Asserted, not printed. The failure this catches is silent by construction: the
      # clap derive lives in `nexus-cluster`, so a co-host that forgets to name itself
      # still builds, still boots, and still reports `nexusd-cluster` — the binary that
      # cannot host an agent. An operator debugging sessions stuck in `warming_up` then
      # reads the identity as confirmation of the wrong diagnosis.
      - name: Check the binary says what it is
        shell: bash
        run: |
          set -euo pipefail
          out="$("target/release/${{ matrix.bin }}" --version)"
          echo "$out"
          case "$out" in
            "nexusd-cohost "*) ;;
            *) echo "::error::--version must name this binary, got: $out"; exit 1 ;;
          esac
          case "$out" in
            *"nexus-vfs.${NEXUS_VFS_TAG}"*) ;;
            *) echo "::error::--version must carry the nexus-vfs pin ${NEXUS_VFS_TAG}, got: $out"; exit 1 ;;
          esac

      - name: Stage release payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.package_dir }}"
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.package_dir }}/${{ matrix.bin }}"
          # No sidecar provenance file. `PAIRING.txt` used to ride along here with the
          # tag, the sudocode commit and the nexus-vfs pin in it, and it was a shadow
          # copy of facts that now live in the binary: a text file answers "which revs
          # is this?" only while it stays beside the executable it describes, and the
          # thing that gets copied to a pod is the executable. `--version` answers it
          # from the binary an operator is actually running, and the invariant the file
          # narrated — one nexus-vfs rev in the graph — is a CI check (`one nexus-vfs
          # pin`), which is where an invariant belongs.
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "dist/${{ matrix.package_dir }}/${{ matrix.bin }}"
            tar -C dist -czf "dist/${{ matrix.archive_name }}" "${{ matrix.package_dir }}"
          else
            (cd dist && 7z a -tzip "${{ matrix.archive_name }}" "${{ matrix.package_dir }}" >/dev/null)
          fi
          ls -la "dist/${{ matrix.archive_name }}"

      # This binary gets its OWN budget, several times the slim `nexusd-cluster`
      # one — it links an LLM agent runtime, so a cluster-sized cap here would fail
      # on the first honest build and teach everyone to raise it. Separate numbers,
      # in separate repositories, because the two artifacts answer to different
      # constraints: `nexusd-cluster` is the production daemon that must stay small
      # (its budget lives in nexus-vfs, where it is built), and this is the node
      # that hosts agents.
      #
      # A printed number was the previous state, and printing is not a gate: nobody
      # diffs `du` output across releases, so the first build to double would have
      # shipped. What a cap at ~4% headroom catches is the step change — a
      # dependency that pulls in a second TLS stack or an accidental
      # `debug = true` — while leaving the ordinary drift of a moving runtime alone.
      - name: Check binary size
        shell: bash
        env:
          MAX_SIZE_BYTES: ${{ matrix.max_size_bytes }}
        run: |
          set -euo pipefail
          path="dist/${{ matrix.package_dir }}/${{ matrix.bin }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            actual=$(stat -f '%z' "$path")
          else
            actual=$(stat -c '%s' "$path")
          fi
          archive=$(wc -c < "dist/${{ matrix.archive_name }}" | tr -d ' ')
          echo "binary: $actual bytes (max $MAX_SIZE_BYTES) · archive: $archive bytes"
          if [[ "$actual" -gt "$MAX_SIZE_BYTES" ]]; then
            echo "::error::${{ matrix.package_dir }} exceeds its size budget ($actual > $MAX_SIZE_BYTES bytes)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_dir }}
          path: rust/dist/${{ matrix.archive_name }}

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum nexusd-cohost-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nexusd-cohost-*
            dist/SHA256SUMS.txt
          body: |
            `nexusd-cohost` — the nexus cluster daemon with an in-process sudocode
            agent runtime linked in. Every flag and boot path of `nexusd-cluster`;
            the difference is one service declaration.

            Ask the binary what it is:

            ```
            $ nexusd-cohost --version
            nexusd-cohost <tag>+sudocode.<commit>.nexus-vfs.<tag> (nexus-cluster <ver>, plugin-abi <n>)
            ```

            That is the provenance for a log or a bug report, and it travels with the
            executable rather than beside it. The runtime and the kernel are linked
            into the one binary, and that it holds exactly one nexus-vfs rev is
            enforced by CI's `one nexus-vfs pin` job rather than by an operator.
