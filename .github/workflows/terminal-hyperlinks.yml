name: Browser terminal interaction

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'rust/**'
      # Ordinary integration tests do not change the release binary or driver.
      - '!rust/crates/*/tests/**'
      - 'rust/crates/rusty-sudocode-cli/tests/common/**'
      - 'rust/crates/rusty-sudocode-cli/tests/pty_hyperlinks.rs'
      - 'e2e/terminal-resize/**'
      - '.github/workflows/terminal-hyperlinks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-terminal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Not on draft PRs; see the heavy-job note in rust-ci.yml.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: Painted terminal links, selection and release A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: browser-baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned browser terminal
        run: |
          npm ci --prefix e2e/terminal-resize
          cd e2e/terminal-resize
          npx playwright install --with-deps chromium
      - name: Build independent release artifacts before measuring
        run: |
          cargo build --locked --release --manifest-path browser-baseline/rust/Cargo.toml --target-dir "$RUNNER_TEMP/browser-base" -p rusty-sudocode-cli
          cargo test --locked --release --manifest-path rust/Cargo.toml --target-dir "$RUNNER_TEMP/browser-candidate" -p rusty-sudocode-cli --test pty_hyperlinks --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/browser-driver.jsonl"
          # A test-driver build can replace scode with a dev-dependency feature
          # graph. Restore the normal release graph before freezing the pair;
          # no build follows this step. The compiled driver remains usable.
          cargo build --locked --release --manifest-path rust/Cargo.toml --target-dir "$RUNNER_TEMP/browser-candidate" -p rusty-sudocode-cli --bin scode
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = [json.loads(line) for line in Path(os.environ['RUNNER_TEMP'], 'browser-driver.jsonl').read_text().splitlines()]
          drivers = [item['executable'] for item in data if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'pty_hyperlinks' and item.get('executable')]
          assert len(drivers) == 1
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('SCODE_BROWSER_DRIVER=' + drivers[0] + '\n')
          PY
      - name: Compare real typing, pixels, native drag selection and process resources
        run: |
          python3 e2e/terminal-resize/gui-benchmark.py --driver "$SCODE_BROWSER_DRIVER" \
            --base "$RUNNER_TEMP/browser-base/release/scode" \
            --candidate "$RUNNER_TEMP/browser-candidate/release/scode" \
            --output "$RUNNER_TEMP/browser-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-terminal-measurements
          retention-days: 14
          path: |
            ${{ runner.temp }}/browser-results
            ${{ runner.temp }}/browser-driver.jsonl
          if-no-files-found: error
      - name: Preserve binaries for failed-measurement diagnosis
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-terminal-binaries
          retention-days: 7
          path: |
            ${{ runner.temp }}/browser-base/release/scode
            ${{ runner.temp }}/browser-candidate/release/scode
            ${{ runner.temp }}/browser-candidate/release/deps/pty_hyperlinks-*
          if-no-files-found: warn
