name: Diagnose background status waits

on:
  push:
    branches: [ci/background-animation-settling-20261102]
    paths: [.github/workflows/diagnose-background-waits.yml]

permissions:
  contents: read

jobs:
  mac-trace:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      SCODE_TEST_BACKEND: mock
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the normal native observer
        run: python -m pip install psutil jsonschema
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false
      - name: Trace the three journeys inside the complete native suite
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import importlib.util
          import json
          import os
          from pathlib import Path
          import subprocess
          import threading
          import time
          import psutil
          from collections import Counter

          root = Path.cwd()
          output = Path(os.environ['RUNNER_TEMP']) / 'background-wait-diagnostic'
          output.mkdir()
          source = root / 'rust/crates/rusty-sudocode-cli/tests/pty_background_tasks.rs'
          original = source.read_text(encoding='utf-8')
          text = original

          def insert_after(needle, addition):
              global text
              assert text.count(needle) == 1, needle
              text = text.replace(needle, needle + addition)

          insert_after('fn expect_parent_complete(session: &PtySession, before: &str) {',
                       '\n    let trace = Instant::now();\n    eprintln!("WAIT_PARENT begin");')
          insert_after('        "background launch turn completed",\n    );',
                       '\n    eprintln!("WAIT_PARENT complete {:.3}", trace.elapsed().as_secs_f64());')
          insert_after('    expect_input_ready(session, common::DEFAULT_TIMEOUT, "parent returned to input");',
                       '\n    eprintln!("WAIT_PARENT input-ready {:.3}", trace.elapsed().as_secs_f64());')

          start = text.index('fn background_status_theme(')
          end = text.index('\n#[test]', start)
          body = text[start:end]
          assert body.count('    let (env, _release)') == 1
          body = body.replace('    let (env, _release)', '    common::TRACE_SCREEN_WAITS.store(true, std::sync::atomic::Ordering::Relaxed);\n    let trace = Instant::now();\n    let (env, _release)', 1)
          for stage, needle in [
              ('started', '    let view = common::expect_screen_rows_settled('),
              ('conclusion-settled', '    assert_background_activity(&session, &view, background, no_color);'),
              ('animation-checked', '    session.send("后台-draft").unwrap();'),
              ('typed', '    session.resize(12, 32).unwrap();'),
              ('narrow-ready', '    session.resize(40, 100).unwrap();'),
              ('draft-restored', '    session.send("\\x15").unwrap();'),
              ('draft-cleared', '    let marker = common::turn_status_marker(&session);'),
              ('notification-complete', '    common::expect_screen_rows_settled(\n        &session,\n        |view| {\n            let statistics'),
              ('statistics-settled', '    open(&mut session);'),
              ('details-opened', '    screen(&session, "STATUS_RESULT_READY");'),
              ('result-visible', '    close(session);'),
          ]:
              assert body.count(needle) == 1, stage
              message = '    eprintln!("WAIT_THEME {} {} ' + stage + ' {:.3}", background, no_color, trace.elapsed().as_secs_f64());\n'
              body = body.replace(needle, message + needle, 1)
          body = body.replace('    close(session);', '    close(session);\n    eprintln!("WAIT_THEME closed {:.3}", trace.elapsed().as_secs_f64());', 1)
          text = text[:start] + body + text[end:]
          common_path = source.parent / 'common/mod.rs'
          common_original = common_path.read_text(encoding='utf-8')
          common_flag = 'pub static TRACE_SCREEN_WAITS: std::sync::atomic::AtomicBool = std::sync::atomic::AtomicBool::new(false);\n\n'
          common_text = common_original.replace('fn expect_screen_settled_view<F>(', common_flag + 'fn expect_screen_settled_view<F>(', 1)
          begin = common_text.index('fn expect_screen_settled_view<F>(')
          finish = common_text.index('\n/// Block until', begin)
          wait_body = common_text[begin:finish]
          trace_timer = '\n    let trace_started = Instant::now();\n    let trace_enabled = TRACE_SCREEN_WAITS.load(std::sync::atomic::Ordering::Relaxed);\n    let mut trace_next = 2.0f64;\n'
          wait_body = wait_body.replace('    let mut satisfied = false;', '    let mut satisfied = false;' + trace_timer, 1)
          trace_return = '                    if trace_enabled { eprintln!("WAIT_SCREEN pid={} context={:?} completed={:.3}", std::process::id(), context, trace_started.elapsed().as_secs_f64()); }\n'
          assert wait_body.count('                    return screen;') == 1
          wait_body = wait_body.replace('                    return screen;', trace_return + '                    return screen;', 1)
          trace_progress = '''        if trace_enabled && trace_started.elapsed().as_secs_f64() >= trace_next {
                      eprintln!("WAIT_SCREEN pid={} context={:?} pending={:.3} satisfied={} stable={}", std::process::id(), context, trace_started.elapsed().as_secs_f64(), satisfied, stable);
                      let before = previous.as_deref().unwrap_or("");
                      eprintln!("WAIT_ROWS counts {} -> {}", before.lines().count(), screen.lines().count());
                      for (index, (a, b)) in before.lines().zip(screen.lines()).enumerate().filter(|(_, (a,b))| a != b).take(5) {
                          eprintln!("WAIT_DIFF row={} before={:?} after={:?}", index, a.chars().take(180).collect::<String>(), b.chars().take(180).collect::<String>());
                      }
                      trace_next = trace_started.elapsed().as_secs_f64() + 2.0;
                  }
          '''
          assert wait_body.count('        if Instant::now() >= deadline {') == 1
          wait_body = wait_body.replace('        if Instant::now() >= deadline {', trace_progress + '        if Instant::now() >= deadline {', 1)
          common_text = common_text[:begin] + wait_body + common_text[finish:]
          assert common_text.replace(common_flag, '').replace(trace_timer, '').replace(trace_return, '').replace(trace_progress, '') == common_original
          source.write_text(text, encoding='utf-8')
          common_path.write_text(common_text, encoding='utf-8')
          subprocess.run(['rustfmt', '--edition', '2021', '--config', 'skip_children=true', str(source), str(common_path)], check=True)
          patch = subprocess.check_output(['git', 'diff', '--binary', '--', 'rust'])
          (output / 'instrumentation.patch').write_bytes(patch)
          provenance = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                        'baseline_rust_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD:rust'], text=True).strip(),
                        'scope': 'Private full-suite timing instrumentation. Original assertions, budgets, integration inventory and four-worker configuration; no acceptance attestation.'}
          (output / 'source.json').write_text(json.dumps(provenance, indent=2))

          spec = importlib.util.spec_from_file_location('protected_diagnostic_recipe', root / '.github/local-acceptance/checks.py')
          checks = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checks)
          host_spec = importlib.util.spec_from_file_location('diagnostic_host', root / '.github/scripts/local_acceptance.py')
          host = importlib.util.module_from_spec(host_spec)
          host_spec.loader.exec_module(host)
          host.ROOT = root
          tool = checks.nextest_binary(output)
          options = checks.nextest_options(output)
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--locked', '--format-version=1'], cwd=root/'rust', text=True))
          targets, selection = checks.grouped_workspace_test_targets(root, metadata)
          assert selection['selected_integration_targets'] == 91
          command = [str(tool), 'nextest', 'run', *options, '--locked', '--workspace',
                     '--features', 'engine-acp/mailbox', *checks.workspace_integration_test_targets(targets),
                     '--success-output', 'final']
          os.environ.update(CARGO_BUILD_JOBS=str(os.cpu_count() or 1), CARGO_INCREMENTAL='0')
          result = {**provenance, 'command': command, 'started_at': datetime.now(timezone.utc).isoformat()}
          started = time.monotonic()
          stop = threading.Event()

          def sample():
              with (output/'resources.jsonl').open('w') as resource_log:
                  while not stop.is_set():
                      vm = psutil.virtual_memory()
                      sample = {'seconds': time.monotonic()-started, 'cpu_percent': psutil.cpu_percent(),
                                'logical_cpus': os.cpu_count(), 'available_bytes': vm.available,
                                'memory_total_bytes': vm.total, 'swap_used_bytes': psutil.swap_memory().used,
                                'load_average': os.getloadavg(), 'children': []}
                      for child in psutil.Process().children(recursive=True):
                          try:
                              sample['children'].append({'pid':child.pid, 'name':child.name(), 'rss':child.memory_info().rss,
                                                         'cpu_user_seconds':child.cpu_times().user, 'cpu_system_seconds':child.cpu_times().system})
                          except psutil.Error:
                              pass
                      try:
                          net = subprocess.run(['netstat', '-an', '-p', 'tcp'], capture_output=True, text=True, timeout=10)
                          sample['tcp_states'] = dict(Counter(line.split()[-1] for line in net.stdout.splitlines() if line.startswith(('tcp4','tcp6'))))
                      except subprocess.TimeoutExpired:
                          sample['tcp_probe_error'] = 'TimeoutExpired'
                      resource_log.write(json.dumps(sample)+'\n')
                      resource_log.flush()
                      stop.wait(15)

          observer = threading.Thread(target=sample, daemon=True)
          observer.start()
          code = 0
          try:
              host.run_command(command, root / 'rust', output/'nextest.log', {'CARGO_BUILD_JOBS': str(os.cpu_count() or 1)})
          except RuntimeError as error:
              code = 1
              result['error'] = str(error)
          finally:
              stop.set()
              observer.join(timeout=15)
          result.update(exit_code=code, seconds=time.monotonic() - started,
                        finished_at=datetime.now(timezone.utc).isoformat())
          (output / 'result.json').write_text(json.dumps(result, indent=2))
          raise SystemExit(code)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-background-wait-trace
          path: ${{ runner.temp }}/background-wait-diagnostic
          if-no-files-found: error
          retention-days: 7
