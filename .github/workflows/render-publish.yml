name: Publish fork rendering gate

on:
  workflow_run:
    workflows: [Rendering performance]
    types: [in_progress, completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: fork-render-publish-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository
    name: Verify and publish fork rendering gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      # workflow_run uses the default branch. Never check out the PR here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: metadata
        if: github.event.action == 'completed' && github.event.workflow_run.conclusion == 'success'
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.payload.workflow_run.id, per_page: 100,
            });
            const selected = artifacts.filter(artifact => artifact.name === 'rendering-policy' && !artifact.expired);
            if (selected.length !== 1 || selected[0].size_in_bytes > 256 * 1024)
              throw new Error('Expected one small rendering-policy metadata artifact');
            core.setOutput('artifact_id', selected[0].id);
      - uses: actions/download-artifact@v4
        if: github.event.action == 'completed' && github.event.workflow_run.conclusion == 'success'
        with:
          artifact-ids: ${{ steps.metadata.outputs.artifact_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: candidate-policy
          merge-multiple: true
      - uses: actions/github-script@v7
        with:
          script: |
            const options = {
              github, context, core, root: process.cwd(),
              policyPath: 'candidate-policy/approval.json',
            };
            await require('./e2e/terminal-resize/fork-policy-contract.cjs')(options);
            await require('./e2e/terminal-resize/fork-render-publish.cjs')(options);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-fork-final-approval
          path: |
            final-rendering-approval
            rendering-contract-negative
          if-no-files-found: ignore
