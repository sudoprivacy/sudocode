name: Sub-agent Parity Live E2E

# Explicit company-funded subagent acceptance. The shared native runner owns
# targets, duration limits, retained outcomes and process cleanup. No schedule.

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Comma-separated PTY test names to run (empty = all 8)'
        default: ''
        required: false

concurrency:
  group: subagent-parity-live
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  pty-live:
    name: PTY live e2e (sudorouter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false

      # Seed the proxy config that the live-mode TestEnv reads. Same
      # shape as model-compat.yml but scoped to this workflow so
      # there's no cross-contamination if secrets rotate.
      - name: Write proxy config
        env:
          SUDOROUTER_API_KEY: ${{ secrets.SUDOROUTER_CI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUDOROUTER_API_KEY:-}" ]; then
            echo "::error::SUDOROUTER_CI_API_KEY secret is not set — cannot run live e2e"
            exit 1
          fi
          CONFIG_DIR="$HOME/.nexus/sudocode"
          mkdir -p "$CONFIG_DIR"
          cat > "$CONFIG_DIR/sudocode.json" <<ENDJSON
          {
            "auth_modes": {
              "proxy": {
                "sudorouter": {
                  "baseUrl": "https://hk.sudorouter.ai/v1",
                  "apiKey": "$SUDOROUTER_API_KEY"
                }
              }
            },
            "models": {}
          }
          ENDJSON
          echo "Proxy config written to $CONFIG_DIR/sudocode.json"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shared native process monitor
        run: python -m pip install psutil==7.2.2
      - name: Run explicitly selected live targets
        env:
          SCODE_TEST_BACKEND: live
          SUBAGENT_TESTS: ${{ inputs.tests }}
        run: python ../.github/scripts/live_model_acceptance.py --suite subagent --tests "$SUBAGENT_TESTS" --execute --output "${{ runner.temp }}/subagent-model-acceptance"
        timeout-minutes: 45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subagent-model-acceptance
          path: |
            ${{ runner.temp }}/subagent-model-acceptance/result.json
            ${{ runner.temp }}/subagent-model-acceptance/*.execution.json
            ${{ runner.temp }}/subagent-model-acceptance/*.command.json
          if-no-files-found: warn
          retention-days: 7
