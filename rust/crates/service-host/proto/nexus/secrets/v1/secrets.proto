// GenericSecretsService — encrypted namespace:key KV store with versioning,
// soft-delete, and batch operations.
//
// Extends the vault plugin to serve general-purpose secrets (API keys,
// channel credentials, JWT secrets, auth tokens) alongside the existing
// PasswordVaultService. Shares the same AES-256-GCM encryption, kernel-
// backed storage, and master key — only the data model differs: generic
// secrets are simple namespace:key→value pairs (no VaultEntry schema,
// no TOTP).
//
// Consumer: sudowork SecretStoreClient (replaces HTTP /api/v2/secrets).
// Namespace conventions:
//   channel:{type}:{pluginId}  → token, appSecret, clientSecret, ...
//   provider:{providerId}      → api_key, access_key_id, secret_access_key
//   auth:acp:{backend}         → auth_token
//   auth:jwt                   → webui_secret, webui_secret:{userId}
//
// Protocol version: 2026.1

syntax = "proto3";

package nexus.secrets.v1;

import "google/protobuf/timestamp.proto";

service GenericSecretsService {
  // Create or update a secret. Creates a new version if the key exists.
  // Implicitly restores soft-deleted secrets.
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);

  // Fetch a secret value, latest version by default.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);

  // Soft-delete a secret. Recoverable via RestoreSecret.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  // Restore a soft-deleted secret.
  rpc RestoreSecret(RestoreSecretRequest) returns (RestoreSecretResponse);

  // List secrets with optional namespace filter. Returns metadata only
  // (no values) for efficiency.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // List all versions of a secret (rotation / audit trail).
  rpc ListSecretVersions(ListSecretVersionsRequest) returns (ListSecretVersionsResponse);

  // Batch create/update. Each entry is an independent put.
  rpc BatchPutSecrets(BatchPutSecretsRequest) returns (BatchPutSecretsResponse);

  // Batch fetch. Returns values keyed by "namespace:key".
  rpc BatchGetSecrets(BatchGetSecretsRequest) returns (BatchGetSecretsResponse);

  // Physically delete a specific version. If the deleted version is
  // current, the index rolls back to the previous version. Cannot
  // delete the last remaining version — use DeleteSecret instead.
  rpc DeleteSecretVersion(DeleteSecretVersionRequest) returns (DeleteSecretVersionResponse);

  // Update description metadata without creating a new version.
  // Metadata-only operation — does not touch encrypted version files.
  rpc UpdateSecretDescription(UpdateSecretDescriptionRequest) returns (UpdateSecretDescriptionResponse);

  // Sealed (raw-bytes) variants of Get/Put. The caller supplies or
  // receives the AES-256-GCM (nonce, ciphertext+tag) pair without
  // vault performing the seal/open step. Used by the encrypted-in-git
  // dogfood signing-key keystore: CI hands vault opaque sealed bytes
  // committed in `data/vault-signing/keys.json`, vault rehydrates
  // them with `PutSecretSealed`, then the standard `GetSecret`
  // (which DOES decrypt with the master key) returns plaintext.
  //
  // Localhost-only: handlers reject non-loopback peer addresses with
  // PERMISSION_DENIED. Bypassing the master-key seal is not a safe
  // operation to expose remotely.
  rpc GetSecretSealed(GetSecretRequest) returns (GetSecretSealedResponse);
  rpc PutSecretSealed(PutSecretSealedRequest) returns (PutSecretResponse);
}

// SecretMetadata — returned by list/put operations. Values are never
// included in metadata responses; use GetSecret for values.
message SecretMetadata {
  string namespace = 1;
  string key = 2;
  optional string description = 3;
  int32 current_version = 4;
  bool deleted = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// --- Put ---

message PutSecretRequest {
  string namespace = 1;
  string key = 2;
  string value = 3;
  optional string description = 4;
}

message PutSecretResponse {
  SecretMetadata metadata = 1;
}

// --- Get ---

message GetSecretRequest {
  string namespace = 1;
  string key = 2;
  // Specific historical version. Unset = latest.
  optional int32 version = 3;
}

message GetSecretResponse {
  string namespace = 1;
  string key = 2;
  string value = 3;
  int32 version = 4;
}

// --- Delete ---

message DeleteSecretRequest {
  string namespace = 1;
  string key = 2;
}

message DeleteSecretResponse {
  string namespace = 1;
  string key = 2;
  bool deleted = 3;
}

// --- Restore ---

message RestoreSecretRequest {
  string namespace = 1;
  string key = 2;
}

message RestoreSecretResponse {
  string namespace = 1;
  string key = 2;
  bool restored = 3;
  int32 current_version = 4;
}

// --- List ---

message ListSecretsRequest {
  // Filter by namespace. Unset = list all namespaces.
  optional string namespace = 1;
  // Include soft-deleted secrets in the response.
  bool include_deleted = 2;
}

message ListSecretsResponse {
  repeated SecretMetadata secrets = 1;
  int32 count = 2;
}

// --- Versions ---

message SecretVersion {
  int32 version = 1;
  google.protobuf.Timestamp created_at = 2;
  // True on the active version of a soft-deleted secret.
  bool tombstoned = 3;
}

message ListSecretVersionsRequest {
  string namespace = 1;
  string key = 2;
}

message ListSecretVersionsResponse {
  string namespace = 1;
  string key = 2;
  int32 count = 3;
  repeated SecretVersion versions = 4;
}

// --- Batch Put ---

message BatchPutSecretsRequest {
  repeated PutSecretRequest secrets = 1;
}

message BatchPutSecretsResponse {
  repeated SecretMetadata results = 1;
  int32 count = 2;
}

// --- Batch Get ---

message BatchGetSecretsRequest {
  repeated GetSecretRequest queries = 1;
}

message BatchGetSecretsResponse {
  // Values keyed by "namespace:key". Missing/deleted secrets are
  // omitted (not an error).
  map<string, string> secrets = 1;
  int32 count = 2;
}

// --- Delete Version ---

message DeleteSecretVersionRequest {
  string namespace = 1;
  string key = 2;
  int32 version = 3;
}

message DeleteSecretVersionResponse {
  string namespace = 1;
  string key = 2;
  int32 version = 3;
  bool deleted = 4;
}

// --- Update Description ---

message UpdateSecretDescriptionRequest {
  string namespace = 1;
  string key = 2;
  string description = 3;
}

message UpdateSecretDescriptionResponse {
  string namespace = 1;
  string key = 2;
  string description = 3;
}

// --- Sealed Get / Put (raw AEAD bytes) ---
//
// Sealed variants expose vault's internal (nonce, ciphertext) pair
// without performing the AES-256-GCM seal/open. The master key never
// leaves vault — `nonce` and `ciphertext` are opaque from the caller's
// perspective; only a vault instance holding the same master key can
// decrypt them via standard `GetSecret`.

message GetSecretSealedResponse {
  string namespace = 1;
  string key = 2;
  // 12 raw bytes — the GCM nonce used at seal time.
  bytes nonce = 3;
  // GCM ciphertext (contains the 16-byte authentication tag at end).
  bytes ciphertext = 4;
  int32 version = 5;
}

message PutSecretSealedRequest {
  string namespace = 1;
  string key = 2;
  // 12 raw bytes — the GCM nonce produced by a prior seal call.
  bytes nonce = 3;
  // GCM ciphertext (contains the 16-byte authentication tag at end).
  bytes ciphertext = 4;
  optional string description = 5;
}
