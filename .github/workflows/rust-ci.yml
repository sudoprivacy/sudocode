name: Rust CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    name: Measure shared glyph and style storage with original workloads
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39340958866
          name: linux-arc-cell-pilot-validated
          path: reference-artifact
      - name: Restore immutable baseline and trusted driver
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess
          for name in ['scode-fixed','driver-pilot']:
              sources=list(Path('reference-artifact').rglob(name))
              assert len(sources)==1,sources
              target=Path(os.environ['RUNNER_TEMP'])/name
              shutil.copy2(sources[0],target)
              target.chmod(target.stat().st_mode | 0o111)
              print(name,hashlib.sha256(target.read_bytes()).hexdigest())
          version=json.loads(subprocess.check_output([str(Path(os.environ['RUNNER_TEMP'])/'scode-fixed'),'version','--output-format','json'],text=True))
          assert len(version['git_sha'])>=7 and '82a99dd262c746a1872ccfaf0ea46d7fe4bd6754'.startswith(version['git_sha']),version
          PYTHON
      - name: Build and freeze normal production candidate
        run: |
          cargo build --release --locked --manifest-path rust/Cargo.toml -p rusty-sudocode-cli --bin scode
          cp rust/target/release/scode "$RUNNER_TEMP/scode-prototype"
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, os, subprocess
          p=Path(os.environ['RUNNER_TEMP'])/'scode-prototype'
          version=json.loads(subprocess.check_output([str(p),'version','--output-format','json'],text=True))
          assert len(version['git_sha'])>=7 and os.environ['GITHUB_SHA'].startswith(version['git_sha']),version
          print(json.dumps({'version':version,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}))
          PYTHON
      - run: npm ci --prefix e2e/terminal-resize
      - name: Run original long and capped workloads in paired order
        run: python3 .github/diagnostics/ascii_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-shared-style-cell-pilot
          path: |
            ${{ runner.temp }}/ascii-cell-pilot
            ${{ runner.temp }}/scode-fixed
            ${{ runner.temp }}/scode-prototype
            ${{ runner.temp }}/driver-pilot
          if-no-files-found: error
