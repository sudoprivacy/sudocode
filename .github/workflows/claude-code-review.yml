name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]
    paths:
      - rust/**

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    env:
      # Must be job-level: the action re-declares ANTHROPIC_BASE_URL from the
      # workflow `env` context into its own step, and a step-level `env:` on that
      # step would be shadowed rather than merged.
      ANTHROPIC_BASE_URL: https://api.sudorouter.ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # A proxy-mode gateway key, not a personal subscription OAuth token.
          # The OAuth token this job used to carry expired on 2026-04-30 and its
          # account was suspended on 2026-09-27, which took every review in the
          # repository silently dead — the job failed in 23-36s having made zero
          # model calls. Same secret, same reason the 'Live API smoke test' job
          # went red on main; that one moved to this key and recovered.
          anthropic_api_key: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The cheapest Claude model this key can reach, by the gateway's own
          # numbers — not the strongest.
          #
          # Cost: a real review of #819 ran 24 turns for $1.26 on claude-sonnet-4-6.
          # The gateway's own model_ratio is 1.5 for claude-sonnet-4-6 and 0.5 for
          # claude-haiku-4-5-20251001 (completion_ratio 5 for both), so this is
          # exactly 3x cheaper — roughly $0.42 a review. A PR review is a
          # read-the-diff-and-comment job; it does not need the strongest model.
          #
          # Reachability is not assumed. An unreachable model fails exactly like a
          # rejected credential — a red job that reads as a finding about the diff,
          # which is the trap this workflow already has two guards for. Checked
          # against the gateway instead: every channel serving claude-sonnet-4-6
          # (the model a review is *proven* to have reached) also serves
          # claude-haiku-4-5-20251001, same channel and same group, so any key that
          # reached the one reaches the other. The alias `claude-haiku-4-5` is NOT
          # on every one of those channels; the dated id is.
          claude_args: '--model claude-haiku-4-5-20251001'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # A review that never reached a model is an INFRASTRUCTURE failure, and it must
      # not read like a finding about the diff. Unannotated, this job fails with
      # `Claude execution failed: result is_error:true` — which sent three separate
      # PRs looking for a code problem that did not exist, while the real cause was a
      # rejected credential.
      #
      # The signal is structured, not prose: the action's own result log carries
      # `num_turns` and `total_cost_usd`, and a run that was refused before the first
      # turn has `num_turns <= 1` with zero cost. Still a failure — a review that did
      # not happen is not a review that passed — but one that names its cause.
      - name: Say when the review never reached a model
        if: failure()
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "$log" ]; then
            echo "::warning::no execution log at $log — the action failed before it wrote one"
            exit 0
          fi
          turns=$(jq -r '[..|objects|select(has("num_turns"))|.num_turns]|first // empty' "$log")
          cost=$(jq -r '[..|objects|select(has("total_cost_usd"))|.total_cost_usd]|first // empty' "$log")
          echo "num_turns=${turns:-unknown} total_cost_usd=${cost:-unknown}"
          if [ "${turns:-99}" -le 1 ] 2>/dev/null && [ "${cost:-1}" = "0" ]; then
            echo "::error::The code review never reached a model (num_turns=$turns, cost=$cost) — the credential or model this job uses is being rejected. This is an infrastructure failure, NOT a finding about this pull request. Check SUDOROUTER_CI_API_KEY and whether its group can reach the model in claude_args; do not read this as a comment on the diff."
          fi

      # The other way a review can not happen — and the dangerous one, because it
      # is GREEN. The action validates that the workflow file on the head branch
      # is byte-identical to the one on the default branch; when it is not, it
      # `return`s before the first model call and the composite step still
      # succeeds. So a stale branch, or any PR that edits this very file, gets a
      # passing `claude-review` check for a review that never ran. It does set
      # `skipped_due_to_workflow_validation_mismatch`, but `action.yml` never
      # declares that output, so a composite caller cannot see it — the readable
      # signal is that `execution_file` was never set.
      #
      # Warning rather than failure, deliberately: a PR that changes this
      # workflow cannot make the check pass from inside the PR (the mismatch is
      # the change), so failing here would leave such PRs permanently red with no
      # fixable cause. A stale branch, by contrast, is fixable — merge the
      # default branch — and the message says so.
      - name: Say when the review was skipped before it started
        if: success() && steps.claude-review.outputs.execution_file == ''
        run: |
          echo "::warning::claude-review did not run: the action skipped before its first model call, so this green check is NOT a passing code review. Cause is almost always workflow validation — the copy of .github/workflows/claude-code-review.yml on this branch differs from the one on the default branch. If this PR does not edit that file, merge the default branch into this branch and the review will run. If it does edit it, the review can only run once the PR is merged."
          {
            echo "### :warning: No code review happened"
            echo
            echo "\`claude-review\` exited before its first model call, so this job being green"
            echo "does not mean the diff was reviewed. See the warning annotation for the cause."
          } >> "$GITHUB_STEP_SUMMARY"

