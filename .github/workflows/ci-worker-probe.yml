name: Private background history wire

on:
  push:
    branches: [diagnostics/ci-workers-macos-20261102]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      SCODE_TEST_BACKEND: mock
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0412b94c7bbd938959e8ae2fa59e60bf2e4891a3
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve existing cache paths
        id: cache
        run: python candidate/.github/local-acceptance/cache_layout.py --source candidate/rust --github-output
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.cache.outputs.workspaces }}
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false
      - name: Install process observer
        run: python -m pip install psutil jsonschema
      - name: Capture the actual background-history wire
        run: python driver/.github/diagnostics/history_wire_probe.py --source candidate --output "${{ runner.temp }}/native-workers"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: background-history-wire-linux
          path: ${{ runner.temp }}/native-workers
          if-no-files-found: error
          retention-days: 7
