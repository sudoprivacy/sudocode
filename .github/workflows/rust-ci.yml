name: Rust CI

on:
  push:
    branches:
      - main
      - 'gaebal/**'
      - 'omx-issue-*'
    paths:
      # Every workflow, not two named ones. A `paths:` list that enumerates
      # workflow FILES gives a PR adding a new one zero checks — and with required
      # status checks that PR can only land by admin override, which is the
      # "skipped reads as passed" shape this repo keeps stamping out. Matching the
      # directory costs one cheap run per workflow edit and makes a new gate
      # arrive already gated.
      - .github/workflows/**
      - .github/scripts/**
      - .github/FUNDING.yml
      - README.md
      - sudo-code-roadmap.html
      - CLAUDE.md
      - CONTRIBUTING.md
      - LAST_CODEX_REF_VERSION
      - LAST_PARITY_SYNC_COMMIT
      - LAST_CCB_REF_VERSION
      - docs/**
      - rust/**
      # The a2a-live job RUNS these; without them a harness change ships untested.
      - e2e/**
      - install.sh
      - scripts/publish_release_mirror.py
      - scripts/generate_cache_metrics.py
      - scripts/cache_metrics.py
      - scripts/check_cache_usage_fixtures.py
      - spec/cache_metrics.json
      - spec/prompt_cache_observations.json
      - spec/cache_usage_fixtures.json
      - spec/cache_usage_fixtures.schema.json
  pull_request:
    # `ready_for_review` starts the full run when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      # Every workflow, not two named ones. A `paths:` list that enumerates
      # workflow FILES gives a PR adding a new one zero checks — and with required
      # status checks that PR can only land by admin override, which is the
      # "skipped reads as passed" shape this repo keeps stamping out. Matching the
      # directory costs one cheap run per workflow edit and makes a new gate
      # arrive already gated.
      - .github/workflows/**
      - .github/scripts/**
      - .github/FUNDING.yml
      - README.md
      - sudo-code-roadmap.html
      - CLAUDE.md
      - CONTRIBUTING.md
      - LAST_CODEX_REF_VERSION
      - LAST_PARITY_SYNC_COMMIT
      - LAST_CCB_REF_VERSION
      - docs/**
      - rust/**
      # The a2a-live job RUNS these; without them a harness change ships untested.
      - e2e/**
      - install.sh
      - scripts/publish_release_mirror.py
      - scripts/generate_cache_metrics.py
      - scripts/cache_metrics.py
      - scripts/check_cache_usage_fixtures.py
      - spec/cache_metrics.json
      - spec/prompt_cache_observations.json
      - spec/cache_usage_fixtures.json
      - spec/cache_usage_fixtures.schema.json
  # The merge queue tests the group that will become main: no path filter,
  # every required check reports.
  merge_group:
  workflow_dispatch:
    inputs:
      render_performance:
        description: 'Run release rendering calibration before enabling the required gate'
        type: boolean
        default: false
      live_only:
        description: 'Run genuine ACP and Linux/Windows model acceptance only; normal PR gates remain unchanged'
        type: boolean
        default: false
      cache_only:
        description: 'Validate dependency cache publication without E2E or provider calls'
        type: boolean
        default: false
      cache_linux_only:
        description: 'Limit manual cache validation to Linux'
        type: boolean
        default: true

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-cache:
    # Main has an independent publisher that survives a newer main push.
    # Manual cache-only runs validate miss/hit in their own branch scope.
    if: github.event_name == 'workflow_dispatch' && inputs.cache_only
    uses: ./.github/workflows/ci-dependency-cache.yml
    with:
      linux_only: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_linux_only }}

  rendering-calibration:
    if: github.event_name == 'workflow_dispatch' && inputs.render_performance && !inputs.cache_only
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/render-performance.yml
    with:
      profile: core

  release-mirror:
    if: &standard_ci ${{ !inputs.render_performance && !inputs.live_only && !inputs.cache_only }}
    name: release mirror recovery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise interrupted publication and real installer
        run: python3 e2e/release-mirror/run.py

  doc-source-of-truth:
    if: *standard_ci
    name: docs source-of-truth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check docs and metadata for stale branding
        run: python .github/scripts/check_doc_source_of_truth.py

  fmt:
    if: *standard_ci
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check generated cache metrics
        run: python3 ../scripts/generate_cache_metrics.py --check
      - name: Validate public cache usage fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public cache usage fixtures
        run: |
          python3 -m pip install jsonschema==4.26.0
          python3 ../scripts/check_cache_usage_fixtures.py

  boundary-gate:
    if: *standard_ci
    name: engine/renderer boundary gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Every committed shell script must be executable
        shell: bash
        # `core.filemode=false` on a Windows checkout means a new script is
        # committed 100644 and nobody notices until a runner reports
        # `Permission denied` with exit 126 — which reads as a missing file.
        # It has cost two rounds now, so the mode is asserted rather than
        # remembered.
        run: |
          set -euo pipefail
          bad=$(git ls-files -s '*.sh' | awk '$1 != "100755" { print $4 }')
          if [ -n "$bad" ]; then
            echo "::error::not executable in the index — run: git update-index --chmod=+x <file>"
            echo "$bad"
            exit 1
          fi
          echo "all committed shell scripts are executable"

      - name: Renderer crates must not name engine-internal streaming types
        run: bash .github/scripts/check_engine_boundary.sh
      - name: Exercise real Git boundary violations and scanner failures
        run: python3 e2e/engine-boundary/run.py

      - name: Resolve the locked Nexus protocol source
        id: nexus-protocol
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          packages = tomllib.loads(pathlib.Path('rust/Cargo.lock').read_text())['package']
          sources = {p['source'] for p in packages if p.get('source', '').startswith('git+https://github.com/nexi-lab/nexus-vfs?')}
          if len(sources) != 1:
              raise SystemExit('Expected exactly one locked Nexus source')
          revision = next(iter(sources)).rsplit('#', 1)[-1]
          if not re.fullmatch('[a-f0-9]{40}', revision):
              raise SystemExit('Invalid locked Nexus revision')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: nexi-lab/nexus-vfs
          ref: ${{ steps.nexus-protocol.outputs.revision }}
          path: .nexus-protocol-source
          sparse-checkout: proto/nexus/grpc/vfs
          persist-credentials: false
      - name: Vendored vfs.proto must match the locked Nexus revision
        run: diff -u --strip-trailing-cr .nexus-protocol-source/proto/nexus/grpc/vfs/vfs.proto rust/crates/nexus-vfs-client/proto/nexus/grpc/vfs/vfs.proto

  test-workspace:
    # One Linux feedback run per ready PR; all three operating systems gate the
    # merge commit in the queue. Do not repeat those same suites on push/main.
    # Explicit Windows/macOS jobs below retain the required check names when
    # skipped on PRs, without allocating runners. Drafts allocate none.
    if: &full_ci ${{ !inputs.render_performance && !inputs.live_only && !inputs.cache_only && !(github.event_name == 'pull_request' && github.event.pull_request.draft) && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    name: cargo test --workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env: &workspace_ci_env
      SCODE_TEST_BACKEND: mock
      # Keep debug assertions; omit disposable DWARF/PDB output. Resource
      # acceptance has separate jobs and retains the normal release profile.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps: &test_workspace_steps
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse unchanged CLI builds and refresh Git metadata
        env:
          BUILD_METADATA_EVIDENCE: ${{ runner.temp }}/scode-build-metadata
        run: python ../e2e/build-metadata/run.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false
      - name: Widen the Windows ephemeral port range
        # The PTY steps run back to back on one VM, and every mock server binds
        # 127.0.0.1:0. Ports left in TIME_WAIT accumulate across steps until
        # Windows' default 16,384-port dynamic range runs out, and bind fails
        # with WSAENOBUFS (10055) in whichever test happens to be next — as it
        # did in a merge-queue group, ejecting an unrelated PR. Raise the
        # ceiling once for the job rather than retrying binds in every test.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=10000 num=55535
          netsh int ipv4 show dynamicport tcp
      - name: Pinned Codex Mermaid upstream tests
        # The pinned upstream crate has a standalone lockfile and is excluded
        # from workspace membership. Keep its original suite in every OS gate.
        # This step shares the existing cache and adds no separate CI job.
        run: cargo test --locked --manifest-path vendor/codex-mermaid/Cargo.toml --target-dir target
      - name: Type-check benchmark entry points
        # Preserve the API-drift check without an extra optimized build/link of
        # every workspace test and benchmark. Reuse this job's debug graph.
        run: cargo check --workspace --benches --locked
      - name: Run workspace tests
        # Keep panic diagnostics visible if a Windows PTY aborts before libtest
        # can print its captured failure output. This includes cache-prefix,
        # compaction, paste, subagent, tool-pause, colors/layout, plan, model
        # precedence and stderr suites; separate pre-runs duplicated them.
        env:
          RUST_TEST_NOCAPTURE: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: cargo test --workspace --locked --features engine-acp/mailbox

  test-workspace-windows:
    if: &queue_ci ${{ !inputs.render_performance && !inputs.live_only && !inputs.cache_only && github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    name: cargo test --workspace (windows-latest)
    runs-on: windows-latest
    env: *workspace_ci_env
    steps: *test_workspace_steps

  test-workspace-macos:
    if: *queue_ci
    name: cargo test --workspace (macos-latest)
    runs-on: macos-latest
    env: *workspace_ci_env
    steps: *test_workspace_steps

  terminal-resize:
    if: *full_ci
    name: Real terminal resize (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env: *workspace_ci_env
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned Unix terminal model
        if: runner.os != 'Windows'
        working-directory: .
        run: npm ci --prefix e2e/terminal-resize
      - name: Cache the pinned Windows terminal host
        if: runner.os == 'Windows'
        id: terminal-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scode-terminal-host
          key: scode-terminal-windows-x64-07f806f999227108933c2e30515b26eecc1fda74
      - name: Install the pinned Windows terminal host
        if: runner.os == 'Windows' && steps.terminal-cache.outputs.cache-hit != 'true'
        working-directory: .
        shell: pwsh
        run: python e2e/terminal-resize/setup_windows.py "$env:RUNNER_TEMP/scode-terminal-host"
      - name: Verify bounded downloads and checksum rejection with the real archive
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: python e2e/terminal-resize/check_windows_setup.py "$env:RUNNER_TEMP/scode-terminal-host/host.zip"
      - name: Select the Windows terminal runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "SCODE_TERMINAL_HOST=$env:RUNNER_TEMP/scode-terminal-host/Code.exe" >> $env:GITHUB_ENV
          "SCODE_TERMINAL_MODULES=$env:RUNNER_TEMP/scode-terminal-host/07f806f999/resources/app/node_modules.asar" >> $env:GITHUB_ENV
      - name: Preserve history and input through actual PTY resize
        env:
          SCODE_TEST_BACKEND: mock
          SCODE_TERMINAL_LOG_DIR: ${{ runner.temp }}/scode-resize-logs
        run: cargo test -p rusty-sudocode-cli --test pty_chrome_resize -- --ignored --nocapture
      - name: Preserve streaming prose handoff, native history and drafts
        env:
          SCODE_TEST_BACKEND: mock
          SCODE_TERMINAL_LOG_DIR: ${{ runner.temp }}/scode-resize-logs
        run: cargo test -p rusty-sudocode-cli --test pty_prose_preview -- --ignored --nocapture
      - name: Answer palette queries through the ready Unix terminal peer
        if: runner.os != 'Windows'
        env:
          SCODE_TEST_BACKEND: mock
          SCODE_TERMINAL_LOG_DIR: ${{ runner.temp }}/scode-resize-logs
        run: cargo test -p rusty-sudocode-cli --test pty_codex_colors -- --ignored --nocapture
      - name: Preserve full review documents in native scrollback
        env:
          SCODE_TEST_BACKEND: mock
          SCODE_TERMINAL_LOG_DIR: ${{ runner.temp }}/scode-resize-logs
        run: cargo test -p rusty-sudocode-cli --test pty_review_scrollback -- --ignored --nocapture
      - name: Retain terminal buffer and wire traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scode-terminal-resize-${{ matrix.os }}
          path: ${{ runner.temp }}/scode-resize-logs/
          if-no-files-found: warn

  shared-services:
    if: *queue_ci
    uses: ./.github/workflows/shared-services.yml

  integration-gate:
    # A dependency failure normally skips its dependants, and skipped required
    # checks count as passing. Always evaluate the actual integration results.
    if: ${{ always() && !inputs.render_performance && !inputs.live_only && !inputs.cache_only && github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [a2a-live, shared-services]
    name: nexus-A2A live (real daemon)
    runs-on: ubuntu-latest
    steps:
      - name: Require every integrated service journey to succeed
        working-directory: .
        shell: bash
        env:
          A2A_RESULT: ${{ needs.a2a-live.result }}
          SERVICES_RESULT: ${{ needs.shared-services.result }}
        run: |
          set -euo pipefail
          if [[ "$A2A_RESULT" != success || "$SERVICES_RESULT" != success ]]; then
            echo "::error::Integrated acceptance did not succeed: A2A=$A2A_RESULT shared-services=$SERVICES_RESULT"
            exit 1
          fi

  a2a-live:
    # The real daemon and cross-node journeys gate the integrated queue commit
    # once, rather than repeating on the PR and on push/main too.
    if: *queue_ci
    needs: one-nexus-vfs-pin
    name: nexus-A2A journeys (real daemon)
    runs-on: ubuntu-latest
    env: *workspace_ci_env
    # The workflow default is `rust`; the harness lives at the repo root.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false
      # The one thing unit tests structurally cannot reach: an envelope moving
      # through a real gRPC server and a real DT_STREAM, and a blocking tail
      # woken by a real write. `ensure_inbox` shipped broken for exactly that
      # reason — the shape was right, the code ran, and only a daemon has an
      # opinion about whether the stream exists.
      #
      # `run.sh` downloads the daemon the lockfile pins (see fetch-daemon.sh),
      # boots it TLS-on on loopback, mints a client bundle offline, waits for a
      # writable single-voter leader, and runs the deterministic live tests. No
      # secrets: the LLM duet inside the same script gates on SUDOROUTER_API_KEY,
      # which this job has not got.
      #
      # One OS on purpose. What this catches is the client/daemon contract,
      # which does not vary by host — platform-specific daemon behaviour is
      # nexus-vfs's own CI. Adding runners would multiply the daemon-boot flake
      # surface for signal already covered.
      - name: Install native durability fault injector
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends strace
          fi
      - name: A2A round-trip against the pinned daemon
        run: e2e/nexus-a2a/run.sh
      - name: Retain native syscall fault evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-session-durability
          path: |
            /tmp/scode-shared-records-*
            /tmp/scode-shared-runtime-*
          if-no-files-found: ignore

      # One daemon can only show that a client and a server agree. What A2A
      # actually rests on is a mechanism that does not exist until there are
      # two: a receiver parks a blocking tail against its OWN node, a peer
      # writes to ANOTHER, and the envelope arrives because each node's apply
      # observer wakes its own waiters. Two nodes on this runner is the
      # cross-machine topology minus the network, which is the part nexus-vfs's
      # federation CI already owns.
      - name: Cross-node A2A against two nodes
        run: e2e/nexus-a2a/run-cross-node.sh

      # The steps above prove DELIVERY and assert nothing about identity — and
      # `from` is an address, so a forgeable one sends a peer's reply wherever the
      # sender chose. This step asserts the node overrides what the sender wrote.
      #
      # Every harness here is auth-on, so this step is not a second POSTURE; it is
      # the one that asserts the property. A node stamps `from` with the dialling
      # cert's id even under `--insecure-no-auth` (measured, v0.7.20) — that flag
      # makes authentication optional, not the stamp absent — and an identity a
      # node applies without requiring guarantees nothing. Auth-on is the posture
      # with the credential store bound, which is the only one the property can be
      # claimed in.
      - name: Auth-on A2A — the node decides who a message is from
        run: e2e/nexus-a2a/run-auth-on.sh

      # Everything above is an agent that TALKS TO a daemon. This one runs
      # INSIDE one: `nexusd-cohost` is built from this checkout, so the agent
      # under test is the code in this diff — which is the whole reason the crate
      # lives in this repo. The provider is the in-repo mock, so there is no key
      # and no nondeterminism; the live-model variant is a manual run.
      #
      # The receive loop is the part only this can reach. `cohost_mock_llm`
      # drives the same loop in-process, but it hands the loop a transcript it
      # provisioned itself — here the conversation is created over gRPC by a
      # peer, which is the shape production has.
      - name: Co-host duet against a daemon built from this checkout
        env:
          NEXUS_A2A_COHOST_CARGO_CONFIG: ${{ github.workspace }}/.github/ci/cohost-plugin-crypto.toml
        run: e2e/nexus-a2a/run-cohost.sh

      - name: Checkout the VFS contract used by the co-host
        uses: actions/checkout@v4
        with:
          repository: nexi-lab/nexus-vfs
          ref: ${{ needs.one-nexus-vfs-pin.outputs.commit }}
          path: .native-vfs

      - name: Search authorization and restart under the confined co-host owner
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
          NEXUS_SEARCH_USER_RUNTIME_BINARY: ${{ github.workspace }}/rust/target/debug/nexusd-cohost
        run: |
          test -x "$NEXUS_SEARCH_USER_RUNTIME_BINARY"
          cargo build --locked --manifest-path .native-vfs/Cargo.toml -p nexus-search-plugin
          stat -c 'Search fixture plugin bytes: %s' "$CARGO_TARGET_DIR/debug/libnexus_search_plugin.so"
          cargo test --locked --manifest-path .native-vfs/Cargo.toml \
            -p nexus-cluster --all-features --test user_runtime \
            signed_search_keeps_the_owner_boundary_and_reopens_committed_indexes -- --nocapture

      # The one feature combination nothing else builds. `driver-ai` forwards to
      # nexus-cluster so a co-host can carry `llm_mount` — the co-host has to be a
      # superset of the daemon it replaces — and a feature combination no job
      # compiles is one that stops compiling without anyone noticing. Feature
      # unification is the specific risk: this workspace pins `backends` with only
      # `driver-local-connector`, so turning on the Anthropic/OpenAI connectors
      # resolves a graph no other job here has ever built.
      #
      # `check`, not `build`: what can break is resolution and types, and this job
      # has already built the daemon once.
      #
      # `--locked` is the point of the step, not a detail. Without it cargo silently
      # resolves the feature's new crates and updates the lockfile in the runner, so
      # the check passes while the COMMITTED lock cannot build this feature at all —
      # and a release builds `--locked`, so that gap only shows up in a release.
      - name: The driver-ai co-host still resolves
        working-directory: rust
        run: cargo check -p nexusd-cohost --features daemon,driver-ai,egress-gate-presidio --bin nexusd-cohost --locked

  one-nexus-vfs-pin:
    if: *standard_ci
    name: one nexus-vfs pin
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      # Seconds, no build: this is the invariant the co-host rests on, and it is
      # cheap enough to answer before anything compiles.
      #
      # A co-hosted agent takes the daemon's `Arc<Kernel>` and hands back a
      # `SpawnTask<Kernel>` adapter. Two nexus-vfs revs in one graph are two `Kernel`
      # types, and the seam stops unifying — but NOT reliably at compile time: a
      # probe with `kernel` at one tag and the daemon crate at another compiled
      # fine, because the type system only objects where a type actually crosses
      # and Cargo is content to carry both revs. So the graph can hold two kernels
      # in silence, and the real guarantee is the one this checks — the rev is
      # named ONCE, in `[workspace.dependencies]`, and the lockfile resolved it to
      # one commit.
      #
      # A TAG, not a rev: `e2e/nexus-a2a/fetch-daemon.sh` downloads the published
      # daemon matching the pin, and a pin between releases has no daemon to match
      # (it fails loud saying so). The tag recorded in the lock must be the tag the
      # manifest asked for.
      - name: The rev is named once, and the lock agrees
        id: pin
        run: |
          set -euo pipefail
          MANIFEST_TAGS=$(grep 'nexus-vfs' rust/Cargo.toml \
            | grep -oE 'tag = "[^"]+"' | grep -oE 'v[0-9][0-9.]*' | sort -u)
          LOCK_PAIRS=$(grep -oE 'nexus-vfs\?tag=[^#]+#[a-f0-9]{40}' rust/Cargo.lock \
            | sed 's/.*tag=//' | sort -u)
          LOCK_TAGS=$(echo "$LOCK_PAIRS" | sed 's/#.*//' | sort -u)
          LOCK_COMMITS=$(echo "$LOCK_PAIRS" | sed 's/.*#//' | sort -u)
          echo "manifest tags:  $MANIFEST_TAGS"
          echo "lock tags:      $LOCK_TAGS"
          echo "lock commits:   $LOCK_COMMITS"
          # Fail CLOSED on an empty extraction. A pattern that stops matching
          # compares nothing and passes, which is how a guard becomes decoration
          # — the same failure mode this check exists to remove.
          for SET in "$MANIFEST_TAGS" "$LOCK_TAGS" "$LOCK_COMMITS"; do
            if [ -z "$SET" ]; then
              echo "::error::a nexus-vfs pin source extracted nothing — the pattern regressed, or the pin stopped being a tag. Fix the extraction, do not delete the check."
              exit 1
            fi
          done
          for NAME in MANIFEST_TAGS LOCK_TAGS LOCK_COMMITS; do
            eval "SET=\$$NAME"
            COUNT=$(echo "$SET" | grep -c .)
            if [ "$COUNT" -ne 1 ]; then
              echo "::error::$NAME has $COUNT distinct values, expected 1 — a second nexus-vfs rev is in the graph:"
              echo "$SET"
              exit 1
            fi
          done
          if [ "$MANIFEST_TAGS" != "$LOCK_TAGS" ]; then
            echo "::error::the manifest asks for $MANIFEST_TAGS and the lock resolved $LOCK_TAGS — run cargo update -p kernel, or the build is not the pin you think it is"
            exit 1
          fi
          echo "one nexus-vfs pin: $MANIFEST_TAGS ($LOCK_COMMITS)"
          echo "commit=$LOCK_COMMITS" >> "$GITHUB_OUTPUT"

      - name: Vendored VFS contract must match the pinned daemon
        shell: bash
        env:
          NEXUS_PROTO_COMMIT: ${{ steps.pin.outputs.commit }}
        # The wire contract follows the same commit as the Rust client and
        # daemon. A mutable Node-client latest can describe another release.
        run: |
          set -euo pipefail
          [[ "$NEXUS_PROTO_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          url="https://raw.githubusercontent.com/nexi-lab/nexus-vfs/$NEXUS_PROTO_COMMIT/proto/nexus/grpc/vfs/vfs.proto"
          upstream="$RUNNER_TEMP/pinned-vfs.proto"
          vendored='rust/crates/nexus-vfs-client/proto/nexus/grpc/vfs/vfs.proto'
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 "$url" -o "$upstream"
          if ! diff -u --strip-trailing-cr "$upstream" "$vendored"; then
            echo "::error::$vendored differs from pinned nexus-vfs $NEXUS_PROTO_COMMIT"
            exit 1
          fi
          echo "vendored vfs.proto matches pinned nexus-vfs $NEXUS_PROTO_COMMIT"

  bench-compile:
    if: *full_ci
    name: Release acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Match the cache owner; these do not alter the release profile.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release CLI for startup acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p rusty-sudocode-cli --bin scode
          binary="$RUNNER_TEMP/scode-release/scode${{ runner.os == 'Windows' && '.exe' || '' }}"
          mkdir -p "$(dirname "$binary")"
          cp "target/release/scode${{ runner.os == 'Windows' && '.exe' || '' }}" "$binary"
          echo "SCODE_TEST_BIN=$binary" >> "$GITHUB_ENV"
      - name: PTY response logs preserve release streaming and resume
        env:
          SCODE_TEST_BACKEND: mock
        run: cargo test --release -p rusty-sudocode-cli --test pty_model_stream_close raw_stream_capture_keeps_streaming_and_resume_responsive -- --exact --nocapture
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: Install the shared terminal observer for the viewport experiment
        if: runner.os == 'Linux'
        run: npm ci --prefix ../e2e/terminal-resize
      - name: Compile the explicit viewport measurement driver
        if: runner.os == 'Linux'
        run: cargo test --release --locked -p rusty-sudocode-cli --test pty_prompt_viewport --no-run --message-format=json-render-diagnostics > target/prompt-viewport-driver.jsonl
      - name: Install the browser for viewport painting and native selection
        if: runner.os == 'Linux'
        run: ../e2e/terminal-resize/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify viewport painting, wheel input and native selection
        if: runner.os == 'Linux'
        env:
          SCODE_VIEWPORT_MEASURE_DIR: ${{ runner.temp }}/prompt-viewport-browser
        run: cargo test --release --locked -p rusty-sudocode-cli --test pty_prompt_viewport viewport_browser_interaction -- --ignored --exact --nocapture
      - name: Compare the opt-in viewport against normal input with unchanged budgets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          driver=$(python -c 'import json; from pathlib import Path; records=[json.loads(line) for line in Path("target/prompt-viewport-driver.jsonl").read_text().splitlines()]; paths=[row["executable"] for row in records if row.get("reason")=="compiler-artifact" and row.get("target",{}).get("name")=="pty_prompt_viewport" and row.get("executable")]; assert len(paths)==1, paths; print(paths[0])')
          python ../scripts/benchmark_prompt_viewport.py --driver "$driver" --binary "$SCODE_TEST_BIN" --output "$RUNNER_TEMP/prompt-viewport-measurements"
          python ../scripts/benchmark_prompt_viewport.py --observer browser --driver "$driver" --binary "$SCODE_TEST_BIN" --output "$RUNNER_TEMP/prompt-viewport-browser-comparison"
      - name: Retain viewport samples and failed terminal traces
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: prompt-viewport-measurements
          path: ${{ runner.temp }}/prompt-viewport-measurements/
          # Both successful screenshots and original failures are reviewable.
          if-no-files-found: warn
      - name: Retain viewport browser screenshots and selection evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: prompt-viewport-browser
          path: ${{ runner.temp }}/prompt-viewport-browser/
          if-no-files-found: warn
      - name: Retain paired browser CPU, memory and painted-key measurements
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: prompt-viewport-browser-comparison
          path: ${{ runner.temp }}/prompt-viewport-browser-comparison/
          if-no-files-found: warn
      - name: Check complete process startup budget
        shell: bash
        run: python ../e2e/startup/run.py --bin "$SCODE_TEST_BIN" --budget-ms 100 --report target/startup.json
      - name: Retain Windows release CLI for local acceptance
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: scode-windows-ci-${{ github.sha }}
          path: ${{ env.SCODE_TEST_BIN }}
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-${{ matrix.os }}
          path: rust/target/startup.json
          if-no-files-found: warn
      - name: Compare renderer changes with the viewport enabled in both builds
        if: runner.os == 'Linux' && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'viewport-performance-comparison')
        shell: bash
        env:
          VIEWPORT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # An opt-in diagnostic, separate from the automatic on/off budget gate.
        # Freeze the candidate and use an isolated baseline target directory.
        run: |
          set -euo pipefail
          [[ "$VIEWPORT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$VIEWPORT_BASE_SHA"
          base_dependency=$(git show "$VIEWPORT_BASE_SHA:rust/crates/rusty-sudocode-cli/Cargo.toml" | grep -E '^iocraft[[:space:]]*=')
          candidate_dependency=$(grep -E '^iocraft[[:space:]]*=' crates/rusty-sudocode-cli/Cargo.toml)
          if [[ "$base_dependency" == "$candidate_dependency" ]] && git diff --quiet "$VIEWPORT_BASE_SHA" HEAD -- 'crates/rusty-sudocode-cli/src/render*' 'crates/rusty-sudocode-cli/src/repl_ui*'; then
            echo 'Renderer inputs are unchanged; source comparison is not needed.'
            exit 0
          fi
          candidate="$RUNNER_TEMP/scode-viewport-candidate"
          cp "$SCODE_TEST_BIN" "$candidate"
          driver=$(python -c 'import json; from pathlib import Path; rows=[json.loads(line) for line in Path("target/prompt-viewport-driver.jsonl").read_text().splitlines()]; paths=[row["executable"] for row in rows if row.get("reason")=="compiler-artifact" and row.get("target",{}).get("name")=="pty_prompt_viewport" and row.get("executable")]; assert len(paths)==1, paths; print(paths[0])')
          cp "$driver" "$RUNNER_TEMP/scode-viewport-driver"
          base_tree="$RUNNER_TEMP/scode-viewport-base"
          git worktree add --detach "$base_tree" "$VIEWPORT_BASE_SHA"
          base_target="$RUNNER_TEMP/scode-viewport-base-target"
          cargo build --release --locked --manifest-path "$base_tree/rust/Cargo.toml" --target-dir "$base_target" -p rusty-sudocode-cli --bin scode
          python ../scripts/benchmark_prompt_viewport.py --baseline "$base_target/release/scode" --binary "$candidate" --driver "$RUNNER_TEMP/scode-viewport-driver" --output "$RUNNER_TEMP/prompt-viewport-source-headless"
          python ../scripts/benchmark_prompt_viewport.py --observer browser --baseline "$base_target/release/scode" --binary "$candidate" --driver "$RUNNER_TEMP/scode-viewport-driver" --output "$RUNNER_TEMP/prompt-viewport-source-browser"
      - name: Retain renderer before and after samples
        if: always() && runner.os == 'Linux' && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'viewport-performance-comparison')
        uses: actions/upload-artifact@v4
        with:
          name: prompt-viewport-source-comparison
          path: |
            ${{ runner.temp }}/prompt-viewport-source-headless/
            ${{ runner.temp }}/prompt-viewport-source-browser/
          if-no-files-found: warn

  clippy-workspace:
    if: *full_ci
    name: cargo clippy --workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env: *workspace_ci_env
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps: &clippy_workspace_steps
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false
      - name: Run workspace clippy
        run: cargo clippy --workspace

  clippy-workspace-windows:
    if: *queue_ci
    name: cargo clippy --workspace (windows-latest)
    runs-on: windows-latest
    env: *workspace_ci_env
    steps: *clippy_workspace_steps

  clippy-workspace-macos:
    if: *queue_ci
    name: cargo clippy --workspace (macos-latest)
    runs-on: macos-latest
    env: *workspace_ci_env
    steps: *clippy_workspace_steps

  live-api-smoke:
    name: Live API smoke test
    timeout-minutes: 30
    # Also runnable on demand against any branch. Restricting it to pushes on
    # main meant a break in this job could only ever be discovered *after* a
    # merge, and a fix for one could not be verified before merging it — which
    # is how `live_subagent_smoke_stdio` stayed red across three merges.
    # `workflow_dispatch` is safe here in a way that `pull_request` is not: it
    # can only be started by someone with write access, so the token secret is
    # never exposed to a fork's code.
    if: >-
      !inputs.render_performance && !inputs.cache_only &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      SUDOCODE_API_READ_TIMEOUT: &live_idle_seconds '90'
      SCODE_LIVE_MODEL: &live_model gpt-6-luna
      # The native credential selects a verified provider independently of GPT.
      SCODE_NATIVE_MODEL: &native_model ${{ vars.SUDOROUTER_NATIVE_MODEL || 'claude-sonnet-4-6' }}
      SCODE_AZURE_MODEL: &azure_model ${{ vars.SUDOROUTER_AZURE_MODEL || 'deepseek-v3.2-azure' }}
      SCODE_LOG_PATH: ${{ github.workspace }}/scode-acp-live-trace.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false
      - name: Inspect the provider's real usage contract
        working-directory: .
        env:
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          NATIVE_PROXY_AUTH_TOKEN: &native_key ${{ vars.SUDOROUTER_NATIVE_CHANNEL && format('{0}-{1}', secrets.SUDOROUTER_CI_API_KEY, vars.SUDOROUTER_NATIVE_CHANNEL) || secrets.SUDOROUTER_CI_API_KEY }}
          AZURE_PROXY_AUTH_TOKEN: &azure_key ${{ vars.SUDOROUTER_AZURE_CHANNEL && format('{0}-{1}', secrets.SUDOROUTER_CI_API_KEY, vars.SUDOROUTER_AZURE_CHANNEL) || '' }}
          PROXY_BASE_URL: https://api.sudorouter.ai/v1
        run: node .github/scripts/probe_live_usage.cjs "${{ runner.temp }}/provider-usage-contract.json" --require-ready
      - name: Save provider evidence before model acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-contract
          path: ${{ runner.temp }}/provider-usage-contract.json
          retention-days: 7
      - name: Run live API smoke tests
        working-directory: rust
        env:
          # The dedicated CI credential owns this acceptance run's quota.
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          PROXY_BASE_URL: https://api.sudorouter.ai/v1
        run: cargo test -p rusty-sudocode-cli --test acp_live_smoke -- --test-threads=1
      - name: Claude native cache and subagent smoke
        working-directory: rust
        env:
          PROXY_AUTH_TOKEN: *native_key
          PROXY_BASE_URL: https://api.sudorouter.ai/v1
          SCODE_LIVE_MODEL: *native_model
        run: cargo test -p rusty-sudocode-cli --test acp_live_smoke live_subagent_smoke_stdio -- --test-threads=1
      - name: Real model through the co-host controller mailbox
        working-directory: rust
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.sudorouter.ai
          SUDOCODE_TEST_MODEL: *live_model
        run: cargo test --locked -p engine-acp --features mailbox --test session_mailbox_live -- --ignored --nocapture
      - name: Deliver offline Nexus mail through a real model and first receiver start
        working-directory: .
        env:
          SUDO_CODE_CONFIG_HOME: ${{ runner.temp }}/scode-nexus-offline-config
          SCODE_LIVE_AUTH_PROFILE: sudorouter
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const key = process.env.PROXY_AUTH_TOKEN;
          if (!key) throw new Error('SUDOROUTER_CI_API_KEY is required for the offline Nexus PTY');
          const dir = process.env.SUDO_CODE_CONFIG_HOME;
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(path.join(dir, 'sudocode.json'), JSON.stringify({
            auth_modes: { proxy: { sudorouter: { apiKey: key, baseUrl: 'https://api.sudorouter.ai/v1' } } },
            models: {}
          }), { mode: 0o600 });
          NODE
          bash e2e/nexus-a2a/run-live-offline.sh
      - name: Remove offline Nexus model credentials
        if: always()
        env:
          SUDO_CODE_CONFIG_HOME: ${{ runner.temp }}/scode-nexus-offline-config
        run: |
          node -e "require('fs').rmSync(require('path').join(process.env.SUDO_CODE_CONFIG_HOME, 'sudocode.json'), { force: true })"
      - name: Summarize ACP model routing and usage
        if: always()
        working-directory: .
        env:
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          NATIVE_PROXY_AUTH_TOKEN: *native_key
          AZURE_PROXY_AUTH_TOKEN: *azure_key
        run: node .github/scripts/summarize_live_model_trace.cjs "$SCODE_LOG_PATH" "${{ runner.temp }}/scode-acp-live-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acp-live-model-evidence
          path: |
            ${{ runner.temp }}/scode-acp-live-evidence.json
            ${{ runner.temp }}/provider-usage-contract.json
          retention-days: 7

  provider-probe-contract:
    name: Live provider probe contract
    if: ${{ !inputs.render_performance && !inputs.cache_only }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/probe_live_usage.test.cjs

  live-model-pty:
    name: Live model PTY (${{ matrix.os }})
    if: >-
      !inputs.render_performance && !inputs.cache_only &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PROXY_BASE_URL: https://api.sudorouter.ai/v1
      SCODE_TEST_BACKEND: live
      SUDOCODE_API_READ_TIMEOUT: *live_idle_seconds
      SCODE_LIVE_MODEL: gpt-5.4-mini
      SCODE_AZURE_MODEL: *azure_model
      SCODE_LIVE_AUTH_PROFILE: sudorouter
      SCODE_AZURE_CHANNEL: ${{ vars.SUDOROUTER_AZURE_CHANNEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false
      - name: Configure the live provider profiles
        shell: bash
        env:
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          AZURE_PROXY_AUTH_TOKEN: *azure_key
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const key = process.env.PROXY_AUTH_TOKEN;
          if (!key) throw new Error('SUDOROUTER_CI_API_KEY is required for live model acceptance');
          const azureChannel = process.env.SCODE_AZURE_CHANNEL;
          if (!/^[1-9][0-9]*$/.test(azureChannel || '')) {
            throw new Error('SUDOROUTER_AZURE_CHANNEL must identify the Azure acceptance channel');
          }
          const azureKey = process.env.AZURE_PROXY_AUTH_TOKEN;
          if (!azureKey) throw new Error('AZURE_PROXY_AUTH_TOKEN is required for Azure acceptance');
          const baseUrl = process.env.PROXY_BASE_URL;
          const dir = process.env.SUDO_CODE_CONFIG_HOME || path.join(process.env.RUNNER_TEMP, 'scode-live-config');
          const paths = {
            SUDO_CODE_CONFIG_HOME: dir,
            SCODE_LOG_PATH: path.join(process.env.RUNNER_TEMP, 'scode-live-model-trace.jsonl'),
            SCODE_LIVE_ARTIFACTS: path.join(process.env.RUNNER_TEMP, 'scode-live-requests')
          };
          fs.appendFileSync(process.env.GITHUB_ENV,
            Object.entries(paths).map(([key, value]) => `${key}=${value}\n`).join(''));
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(path.join(dir, 'sudocode.json'), JSON.stringify({
            auth_modes: { proxy: {
              sudorouter: { apiKey: key, baseUrl },
              'sudorouter-azure': { apiKey: azureKey, baseUrl }
            } },
            models: {}
          }), { mode: 0o600 });
          NODE
      - name: Check live provider routes before model acceptance
        shell: bash
        working-directory: .
        env:
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          AZURE_PROXY_AUTH_TOKEN: *azure_key
        run: node .github/scripts/probe_live_usage.cjs "$RUNNER_TEMP/pty-provider-contract.json" --require-ready
      - name: Run live model and tool journeys through the real PTY
        shell: bash
        run: |
          cargo test -p rusty-sudocode-cli --test pty_step_budget live_step_budget_preserves_results_across_turns -- --test-threads=1 --nocapture
          cargo test -p rusty-sudocode-cli --test pty_edit_uniqueness live_model_recovers_with_unique_context -- --test-threads=1 --nocapture
          cargo test -p rusty-sudocode-cli --test pty_headless -- --test-threads=1 --nocapture
          SCODE_LIVE_AUTH_PROFILE=sudorouter-azure SCODE_LIVE_MODEL="$SCODE_AZURE_MODEL" cargo test -p rusty-sudocode-cli --test pty_azure_inline_reasoning azure_live_file_roundtrip_has_a_final_answer -- --test-threads=1 --nocapture
          cargo test -p rusty-sudocode-cli --test pty_model_flag_priority configured_model_reads_updated_file_after_resume -- --test-threads=1 --nocapture
          cargo test -p rusty-sudocode-cli --test pty_offline_delivery persisted_message_is_consumed_when_the_receiver_first_starts -- --exact --test-threads=1 --nocapture
          cargo test -p rusty-sudocode-cli --test pty_a2a_overlay queued_and_offline_messages_survive_receiver_restart -- --test-threads=1 --nocapture
          cargo test -p rusty-sudocode-cli --test pty_a2a_overlay pending_batch_and_two_runtimes_share_one_durable_reader -- --test-threads=1 --nocapture
          cargo test -p rusty-sudocode-cli --test pty_shared_session live_independent_runtimes_preserve_tools_and_outputs_in_one_session -- --ignored --exact --test-threads=1 --nocapture
          cargo test -p rusty-sudocode-cli --test pty_agent_permission_bubble -- --test-threads=1 --nocapture
          cargo test -p rusty-sudocode-cli --test pty_bash_process_tree --test pty_input_batch --test pty_hook_progress --test pty_arrow_keys -- --test-threads=1 --nocapture
          cargo test -p rusty-sudocode-cli --test pty_background_tasks inspecting_running_task_does_not_acknowledge_its_future_result -- --nocapture
          cargo test -p rusty-sudocode-cli --test pty_background_tasks exiting_during_a_foreground_tool_reaps_both_process_groups -- --nocapture
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo test -p rusty-sudocode-cli --test pty_file_operations windows_verbatim_paths_read_the_same_file -- --nocapture
            cargo test -p rusty-sudocode-cli --test pty_file_operations edit_then_verify_on_disk -- --nocapture
          fi
          cargo test -p rusty-sudocode-cli --test pty_block_spacing -- --test-threads=1 --nocapture
      - name: Summarize live model routing evidence
        if: always()
        working-directory: .
        env:
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          AZURE_PROXY_AUTH_TOKEN: *azure_key
        run: node .github/scripts/summarize_live_model_trace.cjs "${{ runner.temp }}/scode-live-model-trace.jsonl" "${{ runner.temp }}/scode-live-model-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-model-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/scode-live-model-evidence.json
            ${{ runner.temp }}/pty-provider-contract.json
            ${{ runner.temp }}/scode-live-requests/**/*.json
          retention-days: 7
      - name: Remove live test credentials
        if: always()
        run: |
          node -e "const dir = process.env.SUDO_CODE_CONFIG_HOME; if (dir) require('fs').rmSync(require('path').join(dir, 'sudocode.json'), { force: true })"
