name: Shared services E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'rust/**'
      - 'e2e/shared-services/**'
      - '.github/workflows/shared-services.yml'
  merge_group:
  workflow_dispatch:

concurrency:
  group: shared-services-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  services:
    # Not on draft PRs; see the heavy-job note in rust-ci.yml.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: Shared services (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux PR feedback, then every supported host on the integrated tree.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false
      - name: Build the actual frontend CLI
        working-directory: rust
        run: cargo build --locked -p rusty-sudocode-cli
      - name: Exercise real runtime installation, ownership, authentication and durable data
        shell: bash
        run: |
          set -euo pipefail
          SUFFIX=''
          if [ "$RUNNER_OS" = 'Windows' ]; then SUFFIX='.exe'; fi
          python e2e/shared-services/run.py --scode "rust/target/debug/scode${SUFFIX}" \
            --artifacts "${{ runner.temp }}/scode-services-evidence"
      - name: Resume an explicitly owned authenticated Box through the real CLI
        shell: bash
        run: |
          set -euo pipefail
          source e2e/nexus-a2a/lib.sh
          SUFFIX=''
          if [ "$RUNNER_OS" = 'Windows' ]; then SUFFIX='.exe'; fi
          GRPCURL="$(grpcurl_bin)"
          python e2e/shared-services/existing_box.py --scode "rust/target/debug/scode${SUFFIX}" \
            --grpcurl "$(native_path "$GRPCURL")" \
            --artifacts "${{ runner.temp }}/scode-services-evidence/existing-box"
      - name: Preserve service startup failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-services-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/scode-services-evidence
          if-no-files-found: ignore
          retention-days: 7
