name: Release binaries

on:
  push:
    tags:
      - 'v*'
      - nightly
  workflow_dispatch:
    inputs:
      build_scope:
        description: 'Artifacts to build for manual runs'
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x64
      resume_tag:
        description: 'Resume a stable release using its existing GitHub assets (no rebuild)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.resume_tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.resume_tag }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x64:
    name: build-linux-x64
    if: ${{ !inputs.resume_tag && (github.event_name != 'workflow_dispatch' || inputs.build_scope == 'all' || inputs.build_scope == 'linux-x64') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Install musl build dependencies
        shell: bash
        working-directory: /
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            musl-tools \
            pkg-config

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Build static musl release binary
        run: cargo build --locked --release -p rusty-sudocode-cli --bin scode --target x86_64-unknown-linux-musl

      - name: Verify static musl binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/x86_64-unknown-linux-musl/release/scode"
          "$binary" --version
          ldd_output="$(ldd "$binary" 2>&1 || true)"
          echo "$ldd_output"
          if ! grep -Eq "not a dynamic executable|statically linked" <<< "$ldd_output"; then
            echo "Expected musl build to be a static binary" >&2
            exit 1
          fi
          if readelf -l "$binary" | grep -q "Requesting program interpreter"; then
            echo "Static musl binary unexpectedly has a dynamic interpreter" >&2
            exit 1
          fi

      - name: Stage release payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/scode-linux-x64"
          cp "target/x86_64-unknown-linux-musl/release/scode" "dist/scode-linux-x64/scode"
          cp "../README.md" "dist/scode-linux-x64/README.md"
          chmod +x "dist/scode-linux-x64/scode"

      - name: Archive release payload (tar.gz)
        shell: bash
        run: |
          set -euo pipefail
          tar -C dist -czf "dist/scode-linux-x64.tar.gz" "scode-linux-x64"

      - name: Build deb installer
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0.${GITHUB_RUN_NUMBER}"
          fi
          ../packaging/linux/deb/build-deb.sh \
            --version "$version" \
            --binary target/x86_64-unknown-linux-musl/release/scode \
            --output dist

      - name: Build bundle installer
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0.${GITHUB_RUN_NUMBER}"
          fi
          ../packaging/linux/bundle/build-bundle.sh \
            --version "$version" \
            --binary target/x86_64-unknown-linux-musl/release/scode \
            --output dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scode-linux-x64
          path: rust/dist/scode-linux-x64.tar.gz

      - name: Upload deb workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scode-linux-x64-deb
          path: rust/dist/scode_*_amd64.deb

      - name: Upload bundle workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scode-linux-x64-bundle
          path: rust/dist/scode-linux-x64-bundle.tar.gz

  build:
    name: build-${{ matrix.name }}
    if: ${{ !inputs.resume_tag && (github.event_name != 'workflow_dispatch' || inputs.build_scope == 'all') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            # Oldest hosted arm64 runner: the arm64 binary links glibc
            # dynamically, so the build machine's glibc is the floor the
            # binary demands at runtime — 22.04 = glibc 2.35. (linux-x64 is
            # static musl; its runner version does not matter.)
            os: ubuntu-22.04-arm
            bin: scode
            package_dir: scode-linux-arm64
            archive_name: scode-linux-arm64.tar.gz
          - name: macos-arm64
            os: macos-15
            bin: scode
            package_dir: scode-macos-arm64
            archive_name: scode-macos-arm64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            bin: scode
            package_dir: scode-macos-x64
            archive_name: scode-macos-x64.tar.gz
          - name: windows-x64
            os: windows-2022
            bin: scode.exe
            package_dir: scode-windows-x64
            archive_name: scode-windows-x64.zip
          - name: windows-arm64
            os: windows-11-arm
            bin: scode.exe
            package_dir: scode-windows-arm64
            archive_name: scode-windows-arm64.zip
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Build release binary
        run: cargo build --locked --release -p rusty-sudocode-cli --bin scode

      - name: Stage release payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.package_dir }}"
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.package_dir }}/${{ matrix.bin }}"
          cp "../README.md" "dist/${{ matrix.package_dir }}/README.md"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "dist/${{ matrix.package_dir }}/${{ matrix.bin }}"
          fi

      - name: Archive release payload (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -C dist -czf "dist/${{ matrix.archive_name }}" "${{ matrix.package_dir }}"

      - name: Archive release payload (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/${{ matrix.package_dir }}" `
            -DestinationPath "dist/${{ matrix.archive_name }}" `
            -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_dir }}
          path: rust/dist/${{ matrix.archive_name }}

  publish-release:
    name: publish-release
    if: >-
      always() && !cancelled() &&
      ((startsWith(github.ref, 'refs/tags/') && needs.build-linux-x64.result == 'success' && needs.build.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.resume_tag != ''))
    needs:
      - build-linux-x64
      - build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.resume_tag || github.ref_name }}
      RELEASE_INSTALLER: ${{ inputs.resume_tag && 'release-installer.sh' || 'install.sh' }}
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download build artifacts
        if: inputs.resume_tag == ''
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        if: inputs.resume_tag == ''
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum scode-* scode_*.deb > SHA256SUMS.txt

      - name: Restore original release assets and installer
        if: inputs.resume_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Recovery requires a stable version tag'; exit 1; }
          [[ "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" == false ]]
          gh release download "$RELEASE_TAG" --dir dist --pattern 'scode-*' --pattern 'scode_*.deb' --pattern SHA256SUMS.txt
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git show "$RELEASE_TAG:install.sh" > "$RELEASE_INSTALLER"
          # Keep the original manifest and binaries; never regenerate or re-upload them.
          (cd dist && sha256sum --check --strict SHA256SUMS.txt)

      # `nightly` is a rolling prerelease: same tag every night, assets
      # overwritten in place, name carries the date + short sha so `scode
      # update --check --channel nightly` can show what it points at. Tags
      # containing `-` (v0.2.0-rc.1) publish as prereleases too.
      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          short="$(git rev-parse --short "$GITHUB_SHA")"
          if [[ "$tag" == "nightly" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=nightly $(date -u +%Y-%m-%d) (${short})" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          set -euo pipefail
          # Never hide an already public release on a recovery run.
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || echo true)
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          mirror=false
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [[ "$draft" == false ]]; then
              published=$(mktemp -d)
              gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir "$published"
              cmp dist/SHA256SUMS.txt "$published/SHA256SUMS.txt" || { echo 'Published stable assets differ; rerun the failed publication job with its original artifacts'; exit 1; }
            fi
            if [[ -n "$TENCENT_SECRET_ID" || -n "$TENCENT_SECRET_KEY" ]]; then
              [[ -n "$TENCENT_SECRET_ID" && -n "$TENCENT_SECRET_KEY" ]] || { echo 'Incomplete COS credentials'; exit 1; }
              mirror=true
            fi
          fi
          echo "mirror=$mirror" >> "$GITHUB_OUTPUT"

      - name: Upload release assets while pending
        if: inputs.resume_tag == '' && (steps.publication.outputs.draft == 'true' || steps.meta.outputs.prerelease == 'true')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          draft: ${{ steps.publication.outputs.draft }}
          files: |
            dist/scode-*
            dist/scode_*.deb
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Stage and verify immutable Tencent COS release
        if: steps.publication.outputs.mirror == 'true'
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          set -euo pipefail
          pip install coscmd --quiet
          coscmd config \
            -a "$TENCENT_SECRET_ID" \
            -s "$TENCENT_SECRET_KEY" \
            -b sudowork-release-1309794936 \
            -e cos.accelerate.myqcloud.com
          python3 scripts/publish_release_mirror.py stage --version "$RELEASE_TAG" --installer "$RELEASE_INSTALLER"

      - name: Finalize GitHub release
        if: steps.publication.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Promote verified mirror version
        if: steps.publication.outputs.mirror == 'true'
        run: python3 scripts/publish_release_mirror.py promote --version "$RELEASE_TAG" --installer "$RELEASE_INSTALLER"
