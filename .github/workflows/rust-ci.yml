name: Rust CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: error-observation-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-windows-causal-probe:
    name: Native Windows error observation diagnostic (not PR acceptance)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      SCODE_TEST_BACKEND: mock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare raw bytes and rendered errors with the same immutable CLI
        run: python .github/scripts/probe_error_observation.py
      - name: Preserve every control and the actual Windows binary pair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-error-observation-diagnostic
          path: error-observation-probe/
          retention-days: 7
          if-no-files-found: error
