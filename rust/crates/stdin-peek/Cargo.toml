[package]
name = "stdin-peek"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Deliberately NOT `[lints] workspace = true`.
#
# The workspace root sets `unsafe_code = "forbid"`, and `forbid` cannot be
# relaxed from inside a crate that inherits it. These Win32 operations need
# FFI and therefore `unsafe`: peeking pipe readiness (`PeekNamedPipe`), decoding
# console bytes (`MultiByteToWideChar`), swapping the owned stderr handle
# (`GetStdHandle` / `SetStdHandle`), and clearing standard-handle inheritance
# before a background spawn (`SetHandleInformation`). Isolating these calls here
# keeps `forbid` absolute in
# every other crate: this file is the workspace's entire `unsafe` surface.
#
# If you are tempted to add anything else to this crate — don't. Each function
# here is the smallest safe wrapper around one OS call; policy belongs in a
# crate the lint still covers.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
] }
