name: Rust CI - read-only router diagnostics
on:
  workflow_dispatch:
    inputs:
      routing:
        type: boolean
        default: true
      native_acceptance:
        type: boolean
        default: false
      mailbox_acceptance:
        type: boolean
        default: false
      inventory_only:
        type: boolean
        default: false
      specific_channels:
        type: string
        default: ''
      runner:
        type: choice
        options: [ubuntu-latest, ubuntu-24.04, macos-latest, windows-latest]
        default: ubuntu-latest
permissions:
  contents: read
jobs:
  router-diagnostics:
    if: inputs.routing
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing key routing without exposing credentials
        env:
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          SCODE_PROBE_CHANNELS: ${{ inputs.specific_channels }}
        run: node .github/scripts/probe_router_channels.cjs "${{ runner.temp }}/router-channels.json" ${{ inputs.inventory_only && '--inventory-only' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: router-channel-diagnostics
          path: ${{ runner.temp }}/router-channels.json
          retention-days: 7
  mailbox-acceptance:
    if: inputs.mailbox_acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SCODE_LOG_PATH: ${{ github.workspace }}/mailbox-live-trace.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67c1486ccabd99fa22550f598ffb9be4e032a2fb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Exercise the original real controller mailbox scenario
        working-directory: rust
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.sudorouter.ai
          SUDOCODE_TEST_MODEL: gpt-6-luna
        run: cargo test --locked -p engine-acp --features mailbox --test session_mailbox_live -- --ignored --nocapture
      - name: Retain redacted provider evidence
        if: always()
        env:
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
        run: node .github/scripts/summarize_live_model_trace.cjs "$SCODE_LOG_PATH" "${{ runner.temp }}/mailbox-live-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined67c-mailbox-acceptance
          path: ${{ runner.temp }}/mailbox-live-evidence.json
          retention-days: 7
  native-acceptance:
    if: inputs.native_acceptance
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        model: [claude-sonnet-4-5-20250929, claude-sonnet-5-5]
    env:
      SUDOCODE_API_READ_TIMEOUT: '90'
      SCODE_LIVE_MODEL: ${{ matrix.model }}
      SCODE_LOG_PATH: ${{ github.workspace }}/native-live-trace.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run the original native ACP subagent scenario
        working-directory: rust
        env:
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          PROXY_BASE_URL: https://api.sudorouter.ai/v1
        run: cargo test --locked -p rusty-sudocode-cli --test acp_live_smoke live_subagent_smoke_stdio -- --test-threads=1
      - name: Retain routing and usage evidence without model content
        if: always()
        env:
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
        run: node .github/scripts/summarize_live_model_trace.cjs "$SCODE_LOG_PATH" "${{ runner.temp }}/native-live-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-${{ matrix.model }}
          path: ${{ runner.temp }}/native-live-evidence.json
          retention-days: 7
