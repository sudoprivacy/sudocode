name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths:
      - rust/**
      - .github/**
      - CLAUDE.md
      - CONTRIBUTING.md

concurrency:
  # A delayed draft update must not cancel a ready-for-review execution.
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read

    env:
      # Must be job-level: the action re-declares ANTHROPIC_BASE_URL from the
      # workflow `env` context into its own step, and a step-level `env:` on that
      # step would be shadowed rather than merged.
      ANTHROPIC_BASE_URL: https://api.sudorouter.ai
      ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5-20251001
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.SUDOROUTER_NATIVE_MODEL || 'claude-sonnet-4-6' }}
      ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-6
      # The action stops at the first result, before background agents return.
      # Keep all review fan-out synchronous (upstream #1499).
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify current ready head
        uses: actions/github-script@v7
        with:
          script: |
            core.info(await require('./.github/scripts/assert_claude_review_context.cjs')({ github, context }));

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: &native_key ${{ vars.SUDOROUTER_NATIVE_CHANNEL && format('{0}-{1}', secrets.SUDOROUTER_CI_API_KEY, vars.SUDOROUTER_NATIVE_CHANNEL) || secrets.SUDOROUTER_CI_API_KEY }}
          # The job's read-only token also works when this workflow is edited;
          # App-token exchange otherwise skips those PRs before reviewing them.
          github_token: ${{ github.token }}
          prompt: |
            Repository: ${{ github.repository }}
            Pull request: ${{ github.event.pull_request.number }}
            Required commit: ${{ github.event.pull_request.head.sha }}
            Read and follow .github/prompts/code-review.md for this current-commit CI review.
          claude_args: >-
            --model sonnet
            --allowedTools "Read,Glob,Grep,Agent,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(git show:*),Bash(git diff:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(rg:*),Bash(cat:*)"

      - name: Verify reviewed head is still current
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            core.info(await require('./.github/scripts/assert_claude_review_context.cjs')({ github, context }));

      # A review that never reached a model is an INFRASTRUCTURE failure, and it must
      # not read like a finding about the diff. Unannotated, this job fails with
      # `Claude execution failed: result is_error:true` — which sent three separate
      # PRs looking for a code problem that did not exist, while the real cause was a
      # rejected credential.
      #
      # The signal is structured, not prose: the action's own result log carries
      # `num_turns` and `total_cost_usd`, and a run that was refused before the first
      # turn has `num_turns <= 1` with zero cost. Still a failure — a review that did
      # not happen is not a review that passed — but one that names its cause.
      - name: Say when the review never reached a model
        if: failure()
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "$log" ]; then
            echo "::warning::no execution log at $log — the action failed before it wrote one"
            exit 0
          fi
          turns=$(jq -r '[..|objects|select(has("num_turns"))|.num_turns]|first // empty' "$log")
          cost=$(jq -r '[..|objects|select(has("total_cost_usd"))|.total_cost_usd]|first // empty' "$log")
          echo "num_turns=${turns:-unknown} total_cost_usd=${cost:-unknown}"
          if [ "${turns:-99}" -le 1 ] 2>/dev/null && [ "${cost:-1}" = "0" ]; then
            echo "::error::The code review never reached a model (num_turns=$turns, cost=$cost) — the credential or model this job uses is being rejected. This is an infrastructure failure, NOT a finding about this pull request. Check SUDOROUTER_CI_API_KEY, SUDOROUTER_NATIVE_CHANNEL and the configured model aliases; do not read this as a comment on the diff."
          fi

      # A successful composite step without an execution record is not a review.
      - name: Validate review execution and retain evidence
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          NATIVE_PROXY_AUTH_TOKEN: *native_key
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_NATIVE_CHANNEL: ${{ vars.SUDOROUTER_NATIVE_CHANNEL }}
        run: |
          node .github/scripts/summarize_claude_review.cjs "$EXECUTION_FILE" "${{ runner.temp }}/scode-review-evidence.json"
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-evidence
          path: ${{ runner.temp }}/scode-review-evidence.json
          if-no-files-found: error
          retention-days: 7
