[package]
name = "scode-benchmark-drivers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

# Reuse the original workflows without giving Cargo a CLI binary to rebuild.
# Normal workspace acceptance runs the original CLI targets, once each.
[[test]]
name = "benchmark_render_performance"
path = "../rusty-sudocode-cli/tests/pty_render_performance.rs"
test = false

[[test]]
name = "benchmark_hyperlinks"
path = "../rusty-sudocode-cli/tests/pty_hyperlinks.rs"
test = false

[[test]]
name = "benchmark_prompt_viewport"
path = "../rusty-sudocode-cli/tests/pty_prompt_viewport.rs"
test = false

[dev-dependencies]
mock-anthropic-service = { path = "../mock-anthropic-service" }
pty-expect.workspace = true
runtime = { path = "../runtime" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
