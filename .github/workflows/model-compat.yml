name: Model Compatibility

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated model IDs (empty = auto-fetch from sudorouter)'
        default: ''
        required: false

concurrency:
  group: model-compat
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan bounded model batches
        id: plan
        env:
          SUDOROUTER_API_KEY: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          MANUAL_MODELS: ${{ inputs.models }}
        run: |
          set -euo pipefail
          : "${SUDOROUTER_API_KEY:?SUDOROUTER_CI_API_KEY secret must be set}"
          if [ -n "$MANUAL_MODELS" ]; then
            python3 .github/scripts/model_compat.py plan
          else
            curl --fail --silent --show-error --max-time 60 \
              -H "Authorization: Bearer $SUDOROUTER_API_KEY" \
              https://hk.sudorouter.ai/v1/models \
              | python3 .github/scripts/model_compat.py plan
          fi

  compat:
    name: Model compatibility batch ${{ matrix.shard }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Build the PTY test
        run: cargo test --locked --test pty_model_compat --no-run
        timeout-minutes: 20
      - name: Write isolated proxy config
        env:
          SUDOROUTER_API_KEY: ${{ secrets.SUDOROUTER_CI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = Path.home() / '.nexus/sudocode'
          config.mkdir(parents=True, exist_ok=True)
          (config / 'sudocode.json').write_text(json.dumps({'auth_modes': {'proxy': {
              'sudorouter': {'baseUrl': 'https://hk.sudorouter.ai/v1',
                            'apiKey': os.environ['SUDOROUTER_API_KEY']}}}, 'models': {}}))
          PY
      - name: Run live PTY batch
        env:
          SCODE_TEST_BACKEND: live
          SCODE_COMPAT_MODELS: ${{ matrix.models }}
          SCODE_COMPAT_REPORT: ${{ github.workspace }}/artifacts/model-compat-${{ matrix.shard }}.json
        run: cargo test --locked --test pty_model_compat -- --test-threads=1 --nocapture
        timeout-minutes: 15
      - name: Upload batch report, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-compat-batch-${{ matrix.shard }}
          path: artifacts/model-compat-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  report:
    name: Complete model compatibility report
    if: always() && needs.discover.result == 'success'
    needs: [discover, compat]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: model-compat-batch-*
          merge-multiple: true
          path: artifacts
      - name: Require a complete sweep with real passes
        env:
          COMPAT_MATRIX: ${{ needs.discover.outputs.matrix }}
        run: python3 .github/scripts/model_compat.py collect artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-compat-report
          path: artifacts/model-compat-report.json
          if-no-files-found: error
          retention-days: 30
