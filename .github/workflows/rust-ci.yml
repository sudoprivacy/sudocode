name: Rust CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    name: Diagnose Unicode draft on shipped Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39294583186
          artifact-ids: 12207637963
          path: binaries/main
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39302883208
          artifact-ids: 12214975611
          path: binaries/candidate
      - name: Install the same pinned terminal runtime as the native CI gate
        run: python e2e/terminal-resize/setup_windows.py "$env:RUNNER_TEMP/scode-terminal-host"
      - name: Select the native terminal runtime
        run: |
          "SCODE_TERMINAL_HOST=$env:RUNNER_TEMP/scode-terminal-host/Code.exe" >> $env:GITHUB_ENV
          "SCODE_TERMINAL_MODULES=$env:RUNNER_TEMP/scode-terminal-host/07f806f999/resources/app/node_modules.asar" >> $env:GITHUB_ENV
      - name: Record binary provenance
        run: |
          $mainBinary = Get-ChildItem binaries/main -Recurse -Filter scode.exe | Select-Object -First 1
          $candidateBinary = Get-ChildItem binaries/candidate -Recurse -Filter scode.exe | Select-Object -First 1
          if (!$mainBinary -or !$candidateBinary) { throw 'Missing release artifact' }
          & $mainBinary.FullName version --output-format json
          & $candidateBinary.FullName version --output-format json
          Get-FileHash $mainBinary.FullName
          Get-FileHash $candidateBinary.FullName
          "SCODE_DIAG_BASE=$($mainBinary.FullName)" >> $env:GITHUB_ENV
          "SCODE_DIAG_CANDIDATE=$($candidateBinary.FullName)" >> $env:GITHUB_ENV
      - name: Compare raw and pasted Unicode through both native ConPTY backends
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: '& $env:SCODE_TERMINAL_HOST e2e/terminal-resize/prose-input-diagnostic.cjs "$env:SCODE_DIAG_BASE" "$env:SCODE_DIAG_CANDIDATE"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-prose-unicode-diagnostic
          path: diagnostic-results
          if-no-files-found: error
