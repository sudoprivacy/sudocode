name: Reviewed macOS enrollment operation

on:
  workflow_dispatch:
    inputs:
      target_kind:
        description: 'Exact approved PR or its isolated normal queue group'
        type: choice
        options: [pull_request, merge_group]
        required: true

permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write

jobs:
  bootstrap:
    name: Verify the approved device enrollment
    if: github.actor == 'elfenlieds7'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 59079832bbbb850b9b6239e46ec7d8e7bbc3bed6
          path: protected
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: operation
          sparse-checkout: .github/local-acceptance/enrollment-bootstrap.py
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the exact public diff, administrator review, signed original checks and queue scope
        working-directory: protected
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_TARGET_KIND: ${{ inputs.target_kind }}
        run: python ../operation/.github/local-acceptance/enrollment-bootstrap.py
