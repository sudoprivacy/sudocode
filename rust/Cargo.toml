[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.24"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# ── nexus-vfs: ONE pin for every crate sudocode takes from it ─────────
#
# Co-hosted agents exchange `Arc<Kernel>` and `SpawnTask<Kernel>` with the daemon.
# Every Nexus crate must resolve to the same revision for those types to unify.
# The `nexus-A2A live` harness downloads the daemon matching this published tag.
# A version bump therefore requires a matching nexus-vfs release first.
#
# `default-features = false` on all of them: the kernel's runtime defaults
# (mimalloc, the connector stack, py-hook adapters) are daemon concerns that would
# bloat a standalone CLI. Per-crate features that only one member needs live here
# too, so a member's line stays `{ workspace = true }` and the pin has no second
# place to disagree with itself.
a2a = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "cdff812ee498221464e70efac5d341a491b976b5", default-features = false }
backends = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "cdff812ee498221464e70efac5d341a491b976b5", default-features = false, features = ["driver-local-connector"] }
contracts = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "cdff812ee498221464e70efac5d341a491b976b5", default-features = false }
kernel = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "cdff812ee498221464e70efac5d341a491b976b5", default-features = false }
lib = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "cdff812ee498221464e70efac5d341a491b976b5", default-features = false, features = ["runtime-bridge"] }
managed-agent = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "cdff812ee498221464e70efac5d341a491b976b5", default-features = false }
llm-mount = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "cdff812ee498221464e70efac5d341a491b976b5", default-features = false }
# Test the shipped authorization provider and VFS host through the same kernel.
nexus-rebac = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "cdff812ee498221464e70efac5d341a491b976b5", default-features = false }
transport = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "cdff812ee498221464e70efac5d341a491b976b5", default-features = false }
# The daemon `nexusd-cohost` IS, entered at `run_with_services` so the co-host
# picks its service set without forking the composition root. Same pin as the
# kernel above, necessarily: this crate and the agent runtime it hosts have to
# agree on what `Kernel` is.
nexus-cluster = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "cdff812ee498221464e70efac5d341a491b976b5" }

agent-client-protocol = { version = "0.11", features = ["unstable_session_model", "unstable_session_close", "unstable_session_usage"] }
agent-client-protocol-schema = { version = "0.12", features = ["unstable_session_model", "unstable_session_close", "unstable_session_usage"] }
agent-client-protocol-tokio = "0.11"
axum = { version = "0.8", features = ["ws"] }
pty-expect = { git = "https://github.com/sudoprivacy/pty-expect", tag = "v0.1.1" }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

# The daemon links the kernel and hosted session engine. Optimize across crate
# boundaries and remove release symbols so it fits the existing artifact limits.
[profile.cohost-release]
inherits = "release"
lto = "thin"
strip = "symbols"

# ThinLTO with full speed optimization increases the Windows PE image. Size
# optimization keeps that artifact within the same cap as the Unix builds.
[profile.cohost-release-windows]
inherits = "cohost-release"
opt-level = "s"
