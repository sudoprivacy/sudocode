name: PR merge hygiene

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  history:
    name: Verify PR history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Inspect the PR head, not GitHub's synthetic test merge commit; in the
          # merge queue, the group commit that will become main.
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch current main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Reject silent merge rewrites and leftover conflict markers
        env:
          BASE: ${{ github.event.merge_group.base_sha || 'origin/main' }}
        run: python3 .github/scripts/check_pr_history.py "$BASE" HEAD
      - name: Exercise real Git histories
        run: python3 e2e/pr-history/run.py
