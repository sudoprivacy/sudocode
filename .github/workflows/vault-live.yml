name: Vault live PTY

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/vault-live.yml"
      - "e2e/vault-live/**"
      - "rust/Cargo.lock"
      - "rust/crates/service-host/runtime-artifacts.json"
      - "rust/crates/**/src/**/vault*.rs"
      - "rust/crates/**/src/**/vault*/**"
      - "rust/crates/rusty-sudocode-cli/tests/**/vault*.rs"
      - "rust/crates/rusty-sudocode-cli/tests/pty_vault_live.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-dependencies
          save-if: false
      - name: Run SudoCode against the pinned daemon and signed Vault plugin
        shell: bash
        run: |
          set -euo pipefail
          source e2e/vault-live/lib.sh
          CACHE="$RUNNER_TEMP/vault-archives"
          out="$RUNNER_TEMP/vault-evidence"
          mkdir -p "$out"
          tag="$(fetch_artifacts linux-x86_64 linux-x86_64 libnexus_vault.so)"
          artifact_versions "$CACHE/$tag" > "$out/versions.env"
          (cd rust && cargo fetch --locked)
          run_live_test "$CACHE/$tag" "$out"
          for report in b_list_and_use c_other_owner c_owner_as_agent d_service_missing e_replaced_bundle h_restart; do
            test -s "$out/$report.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vault-live-evidence
          path: |
            ${{ runner.temp }}/vault-evidence/versions.env
            ${{ runner.temp }}/vault-evidence/*.json
          if-no-files-found: warn
