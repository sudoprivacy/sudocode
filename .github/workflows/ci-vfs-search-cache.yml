name: Fixed VFS search compiler cache

on:
  push:
    branches: [main]
    paths:
      - rust/**
      - .github/scripts/vfs_search_cache.py
      - .github/actions/vfs-search-cache/**
      - .github/workflows/ci-vfs-search-cache.yml

concurrency:
  group: fixed-vfs-search-cache-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fixed-drivers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/vfs-search-cache
        with:
          publish: 'true'
