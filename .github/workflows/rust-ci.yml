name: Windows strict lint for a verified Rust snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict:
    name: Windows all-target all-feature Clippy snapshot
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb8541262aaa20fd177ffbc46f96e9520232fa9f
          persist-credentials: false
      - name: Require the exact qualified Rust tree and compiler installer
        shell: bash
        run: |
          test "$(git rev-parse HEAD:rust)" = 8e241c46e4abc13b57ae127f3b7a5ec93bdc58f4
          test "$(git rev-parse HEAD:.github/actions/setup-protoc/action.yml)" = 9f3a47ef68c27253bbe71fc91ded7f102409e1ca
          test "$(git rev-parse HEAD:.github/scripts/setup_protoc.py)" = d1f133ad8ab991d815f6f9aeaca5ee685cf42f70
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-dependencies
          env-vars: ImageOS
          save-if: false
      - name: Run workspace clippy
        run: cargo clippy --workspace --all-targets --all-features --keep-going -- -D warnings
