[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol = { workspace = true }
agent-client-protocol-schema = { workspace = true }
agent-client-protocol-tokio = { workspace = true }
async-trait = "0.1"
axum = { workspace = true }
base64 = "0.22"
chrono = "0.4"
# Cron feature: 5-field POSIX schedule parsing + next-run computation
# (`cron` takes a 6-field expr, so the scheduler prepends a `0` seconds
# field to the CC-standard 5-field input) and per-job IANA timezones.
chrono-tz = "0.9"
cron = "0.12"
futures = "0.3"
# Cross-platform CSPRNG. Replaces the historical Unix-only
# `/dev/urandom` read in oauth::generate_random_token, which broke
# every PKCE-derived test on Windows with `Os { code: 3, kind:
# NotFound, message: "The system cannot find the path specified." }`.
# Already a transitive dep through hyper / reqwest; making it a
# direct dep ensures `runtime` stays compilable if those upstream
# trees ever drop it.
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Nexus kernel rlib — provides `kernel::kernel::syscall::KernelSyscall`
# trait that `runtime::spawn_task::<K>` is generic over. `default-features
# = false` keeps the kernel runtime defaults (mimalloc, connector stack,
# py-hook adapters) off in the sudocode build — sudocode does not need
# them and they would bloat the standalone CLI.
#
# Pinned to the SAME nexus-vfs rev the nexus daemon (rust/nexusd) uses, so
# `SpawnTask<Kernel>` monomorphises to one type when nexusd links both
# sudocode_runtime and the nexus service crates (co-host binary edge).
kernel = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "ec1497591e44fc573585ff6910a011658d5cce50", default-features = false }
# The A2A messaging substrate: SSOT for the mailbox message schema
# (`MailboxEnvelope`) + the `/chat-with-me` path suffix. MUST be the same
# nexus-vfs rev as `kernel` (a2a itself deps kernel; a mismatched rev = two
# distinct `Kernel` types). Re-exported from `spawn_task` so downstream crates
# use it without a direct a2a dependency.
a2a = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "ec1497591e44fc573585ff6910a011658d5cce50", default-features = false }
lib = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "ec1497591e44fc573585ff6910a011658d5cce50", default-features = false, features = ["runtime-bridge"] }
sha2 = "0.10"
glob = "0.3"
keyring = "3"
nexus-vfs-client = { path = "../nexus-vfs-client" }
plugins = { path = "../plugins" }
regex = "1"
# HTTP client for the MCP SSE transport (mcp_sse.rs). Mirrors the api crate:
# rustls-tls to avoid an OpenSSL dependency, `stream` for `bytes_stream()`.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
telemetry = { path = "../telemetry" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tower-http = { workspace = true }
walkdir = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["poll", "process"] }

[target.'cfg(unix)'.dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "bash_pipe_throughput"
harness = false

[lints]
workspace = true
