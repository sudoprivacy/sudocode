name: Rendering performance

on:
  # Automatic PR checks use the protected base. An approved administrator may
  # also dispatch this workflow for a selected PR. Candidate execution has read
  # permissions; its measurement harness always comes from the PR base.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [core, stress]
        default: core
      pull_request:
        description: 'Optional same-repository PR; dispatch from its current head branch'
        type: string
        default: ''
  workflow_call:
    inputs:
      profile:
        type: string
        default: core
  schedule:
    - cron: '20 17 * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: render-performance-${{ github.event.pull_request.number || inputs.pull_request || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  contract:
    name: Rendering policy live PR contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./e2e/terminal-resize/policy-contract.cjs')({
              github, context, core, root: process.cwd(),
            });

  policy:
    name: Rendering benchmark policy
    needs: contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      baseline: ${{ steps.policy.outputs.baseline }}
      head: ${{ steps.policy.outputs.head }}
      is_needed: ${{ steps.policy.outputs.is_needed }}
      trusted: ${{ steps.policy.outputs.trusted }}
      repository: ${{ steps.policy.outputs.repository }}
      pull_number: ${{ steps.policy.outputs.pull_number }}
    steps:
      - name: Mark the candidate gate pending
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.payload.pull_request.head.sha,
              context: 'render performance', state: 'pending',
              description: 'Waiting for policy, A/A calibration and A/B measurements',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: policy
        with:
          script: |
            await require('./e2e/terminal-resize/policy-review.cjs')({
              github, context, core, root: process.cwd(), output: 'selected-policy',
            });
      - name: Mark the approved manual PR gate pending
        if: github.event_name == 'workflow_dispatch' && inputs.pull_request != ''
        uses: actions/github-script@v7
        env:
          SCODE_RENDER_HEAD: ${{ steps.policy.outputs.head }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.SCODE_RENDER_HEAD,
              context: 'render performance', state: 'pending',
              description: 'Approval verified; waiting for real A/A calibration and A/B measurements',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-policy
          path: selected-policy
          if-no-files-found: error

  measure:
    name: Release rendering A/A and A/B
    needs: policy
    if: needs.policy.outputs.is_needed == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '1'
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.profile == 'stress') && 180 || 120 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.policy.outputs.trusted }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.policy.outputs.baseline }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.policy.outputs.repository }}
          # Diagnostic only: profile the exact failed production-source commit.
          ref: 1769e1b2baf9f36d7168247c7d09a70929dc5e74
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rendering-policy
          path: selected-policy
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No shared cache: this job builds untrusted PR code. Keep write tokens
      # and the status publisher in separate jobs with no candidate execution.
      - name: Install the shared terminal observer
        run: npm ci --prefix trusted/e2e/terminal-resize
      - name: Compile both releases and the trusted fixture before timing
        run: |
          set -euo pipefail
          rustc --version > "$RUNNER_TEMP/render-toolchain.txt"
          # Same-version path crates in different checkouts can reuse stale Cargo
          # artifacts. Keep every checkout isolated, including the trusted driver.
          nice -n 10 cargo build --locked --release --manifest-path baseline/rust/Cargo.toml --target-dir "$RUNNER_TEMP/render-build/baseline" -p rusty-sudocode-cli
          cp "$RUNNER_TEMP/render-build/baseline/release/scode" "$RUNNER_TEMP/scode-baseline"
          nice -n 10 cargo build --locked --release --manifest-path candidate/rust/Cargo.toml --target-dir "$RUNNER_TEMP/render-build/candidate" -p rusty-sudocode-cli
          cp "$RUNNER_TEMP/render-build/candidate/release/scode" "$RUNNER_TEMP/scode-candidate"
          nice -n 10 cargo test --locked --release --manifest-path trusted/rust/Cargo.toml --target-dir "$RUNNER_TEMP/render-build/trusted" -p rusty-sudocode-cli --test pty_render_performance --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/render-driver.jsonl"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          messages = [json.loads(line) for line in Path(os.environ['RUNNER_TEMP'], 'render-driver.jsonl').read_text().splitlines()]
          drivers = [item['executable'] for item in messages if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'pty_render_performance' and item.get('executable')]
          assert len(drivers) == 1, drivers
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('SCODE_RENDER_DRIVER=' + drivers[0] + '\n')
          PY
      - name: Collect RSS mappings (diagnostic only, no gate verdict)
        run: |
          python3 trusted/.github/scripts/render-rss-diagnostic.py \
            --driver "$SCODE_RENDER_DRIVER" \
            --base "$RUNNER_TEMP/scode-baseline" \
            --candidate "$RUNNER_TEMP/scode-candidate" \
            --policy selected-policy/performance-policy.json \
            --output "$RUNNER_TEMP/render-rss-diagnostic"
      - name: Preserve partial measurements and approval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-rss-diagnostic
          retention-days: 14
          path: |
            ${{ runner.temp }}/render-rss-diagnostic
            ${{ runner.temp }}/render-toolchain.txt
            ${{ runner.temp }}/render-driver.jsonl
            selected-policy
          if-no-files-found: error

  status:
    name: Publish rendering gate
    if: always() && !cancelled() && (github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.pull_request != ''))
    needs: [contract, policy, measure]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          MEASURE_RESULT: ${{ needs.measure.result }}
          IS_NEEDED: ${{ needs.policy.outputs.is_needed }}
          SCODE_RENDER_HEAD: ${{ needs.policy.outputs.head }}
          SCODE_RENDER_PR: ${{ needs.policy.outputs.pull_number }}
          SCODE_RENDER_BASE: ${{ needs.policy.outputs.trusted }}
        with:
          script: |
            const pullNumber = Number(process.env.SCODE_RENDER_PR
              || context.payload.pull_request?.number || context.payload.inputs?.pull_request);
            const head = process.env.SCODE_RENDER_HEAD
              || context.payload.pull_request?.head.sha || context.sha;
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1)
              throw new Error('A valid PR number is required to publish the rendering gate');
            const current = await github.rest.pulls.get({
              ...context.repo, pull_number: pullNumber,
            });
            if (current.data.head.sha !== head)
              throw new Error('PR advanced; only measurements of its current head may publish the gate');
            let success = process.env.POLICY_RESULT === 'success'
              && (process.env.MEASURE_RESULT === 'success'
                || (process.env.IS_NEEDED === 'false' && process.env.MEASURE_RESULT === 'skipped'));
            let approvalError;
            if (success) {
              try {
                const approval = await require('./e2e/terminal-resize/policy-review.cjs')({
                  github, context, core, root: process.cwd(), output: 'final-rendering-approval',
                });
                if (approval.head !== head || approval.base !== process.env.SCODE_RENDER_BASE)
                  throw new Error('PR base or head changed after the measured artifacts were selected');
              } catch (error) {
                success = false;
                approvalError = error;
              }
            }
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: head,
              context: 'render performance', state: success ? 'success' : 'failure',
              description: success ? (process.env.IS_NEEDED === 'false'
                ? 'No runtime or benchmark changes' : 'Release A/A calibration and A/B budgets passed')
                : 'Policy, calibration or performance failed; inspect artifacts',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (approvalError) core.setFailed(approvalError.message);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-final-approval
          path: final-rendering-approval
          if-no-files-found: ignore
