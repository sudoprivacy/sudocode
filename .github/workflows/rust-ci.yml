name: Rust CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    name: Validate all Windows prose cases against the unchanged production dependency
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run all ordinary prose tests with original Unicode and exact persisted content
        working-directory: rust
        env:
          SCODE_TEST_BACKEND: mock
        run: |
          & cargo test --locked -p rusty-sudocode-cli --test pty_prose_preview -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/prose-complete.log"
          if ($LASTEXITCODE -ne 0) { throw "Prose suite failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-prose-complete
          path: ${{ runner.temp }}/prose-complete.log
          if-no-files-found: error
