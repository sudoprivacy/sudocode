[package]
name = "stdin-peek"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Deliberately NOT `[lints] workspace = true`.
#
# The workspace root sets `unsafe_code = "forbid"`, and `forbid` cannot be
# relaxed from inside a crate that inherits it. Asking Windows whether a pipe
# holds data without starting a read requires `PeekNamedPipe`, which is FFI and
# therefore `unsafe`. Isolating that one call here keeps `forbid` absolute in
# every other crate: this file is the workspace's entire `unsafe` surface.
#
# If you are tempted to add anything else to this crate — don't. Policy belongs
# in a crate the lint still covers.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }
