name: Rust CI - read-only router diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  router-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing key routing without exposing credentials
        env:
          PROXY_AUTH_TOKEN: ${{ secrets.SUDOROUTER_CI_API_KEY }}
        run: node .github/scripts/probe_router_channels.cjs "${{ runner.temp }}/router-channels.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: router-channel-diagnostics
          path: ${{ runner.temp }}/router-channels.json
          retention-days: 7
