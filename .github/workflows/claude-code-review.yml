name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - rust/**
      - .github/workflows/claude-code-review.yml
      - .github/scripts/report_claude_review_failure.py
      - e2e/code-review-diagnostics/**

jobs:
  diagnostic-tests:
    name: Safe review diagnostics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 e2e/code-review-diagnostics/run.py

  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    needs: diagnostic-tests
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    env:
      # Must be job-level: the action re-declares ANTHROPIC_BASE_URL from the
      # workflow `env` context into its own step, and a step-level `env:` on that
      # step would be shadowed rather than merged.
      ANTHROPIC_BASE_URL: https://api.sudorouter.ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # A proxy-mode gateway key, not a personal subscription OAuth token.
          # The OAuth token this job used to carry expired on 2026-04-30 and its
          # account was suspended on 2026-09-27, which took every review in the
          # repository silently dead — the job failed in 23-36s having made zero
          # model calls. Same secret, same reason the 'Live API smoke test' job
          # went red on main; that one moved to this key and recovered.
          anthropic_api_key: ${{ secrets.SUDOROUTER_CI_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Keep review on the gateway's available Haiku route. On 2026-10-14,
          # the dated 4.5 route refused the CLI's prepayment reservation before
          # its first model turn. The advertised 5.5 route returned a real reply
          # with the same CLI version and CI credential entry. A tiny HTTP probe
          # alone does not establish that the CLI's larger reservation can run.
          claude_args: '--model claude-haiku-5-5'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The SDK hides provider messages in its default console output. Read its
      # saved records and publish fixed error categories without message contents.
      # Zero cost alone cannot distinguish billing, WAF and plugin failures.
      - name: Checkout trusted review diagnostics
        if: failure()
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-review-trusted
          persist-credentials: false

      - name: Classify the failed review
        if: failure()
        run: |
          reporter=.ci-review-trusted/.github/scripts/report_claude_review_failure.py
          if [ -f "$reporter" ]; then
            python3 "$reporter" "${RUNNER_TEMP}/claude-execution-output.json" \
              --summary-file "$GITHUB_STEP_SUMMARY"
          else
            echo 'Trusted review diagnostics are unavailable on the protected base.'
          fi

      # The other way a review can not happen — and the dangerous one, because it
      # is GREEN. The action validates that the workflow file on the head branch
      # is byte-identical to the one on the default branch; when it is not, it
      # `return`s before the first model call and the composite step still
      # succeeds. So a stale branch, or any PR that edits this very file, gets a
      # passing `claude-review` check for a review that never ran. It does set
      # `skipped_due_to_workflow_validation_mismatch`, but `action.yml` never
      # declares that output, so a composite caller cannot see it — the readable
      # signal is that `execution_file` was never set.
      #
      # Warning rather than failure, deliberately: a PR that changes this
      # workflow cannot make the check pass from inside the PR (the mismatch is
      # the change), so failing here would leave such PRs permanently red with no
      # fixable cause. A stale branch is fixable by rebasing onto the latest
      # default branch, and the message says so.
      - name: Say when the review was skipped before it started
        if: success() && steps.claude-review.outputs.execution_file == ''
        run: |
          echo "::warning::claude-review did not run: the action skipped before its first model call, so this green check is NOT a passing code review. Cause is almost always workflow validation — the copy of .github/workflows/claude-code-review.yml on this branch differs from the one on the default branch. If this PR does not edit that file, rebase onto the latest default branch and the review will run. If it does edit it, the review can only run once the PR is merged."
          {
            echo "### :warning: No code review happened"
            echo
            echo "\`claude-review\` exited before its first model call, so this job being green"
            echo "does not mean the diff was reviewed. See the warning annotation for the cause."
          } >> "$GITHUB_STEP_SUMMARY"

