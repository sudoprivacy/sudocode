name: CI queue maintenance

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Rust CI']
    types: [requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: ci-queue-maintenance
  cancel-in-progress: false

jobs:
  removed-queue-refs:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # workflow_run uses only protected default-branch cleanup code. Never
      # execute the source PR or merge-group checkout with an Actions write token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Cancel runs whose queue ref was removed
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/cancel_obsolete_queue_runs.py
          --repository '${{ github.repository }}' --cancel
          --output '${{ runner.temp }}/obsolete-queue-runs.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obsolete-queue-runs
          path: ${{ runner.temp }}/obsolete-queue-runs.json
          if-no-files-found: warn
          retention-days: 7
